<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Droitwich United Charities – Website Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14254a; --green:#2f6b3a; --water:#7fa8d6; --cream:#f7f5ef; --ink:#1d2433; --muted:#5b6475;
  --line:#e2e0d8; --white:#fff; --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Source Sans 3",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:17px;line-height:1.6}
h1,h2,h3{font-family:"Libre Baskerville",Georgia,serif;color:var(--navy);line-height:1.2;margin:0 0 .5em}
h2{font-size:clamp(1.6rem,3vw,2.2rem)}
a{color:var(--green)}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid transparent;cursor:pointer;font-size:16px;font-family:inherit;transition:.15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{border-color:var(--navy);color:var(--navy);background:transparent}
.btn-ghost:hover{background:var(--navy);color:#fff}
.mock-bar{background:var(--navy);color:#cfd8ea;font-size:13px;text-align:center;padding:6px 12px}
.mock-bar b{color:#fff}
/* header */
header.site{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:78px;gap:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:58px;height:58px;object-fit:contain}
.brand span{font-family:"Libre Baskerville",serif;font-weight:700;color:var(--navy);font-size:18px;line-height:1.15}
.brand small{display:block;font-family:"Source Sans 3",sans-serif;font-weight:500;color:var(--green);font-size:13px;letter-spacing:.04em}
nav.main{display:flex;gap:22px;align-items:center}
nav.main a{color:var(--navy);text-decoration:none;font-weight:600;font-size:15px}
nav.main a:hover{color:var(--green)}
.menu-btn{display:none;background:none;border:0;font-size:26px;color:var(--navy);cursor:pointer}
@media(max-width:900px){nav.main{display:none;position:absolute;top:78px;left:0;right:0;background:#fff;flex-direction:column;padding:16px;border-bottom:1px solid var(--line)}nav.main.open{display:flex}.menu-btn{display:block}}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#eaf2fb 0%,var(--cream) 100%)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-top:72px;padding-bottom:96px}
.hero h1{font-size:clamp(2rem,4.4vw,3.3rem)}
.hero p.lead{font-size:1.2rem;color:var(--muted);max-width:560px}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero-badge{justify-self:center;width:100%;max-width:400px;filter:drop-shadow(0 18px 30px rgba(20,37,74,.18))}
.ripple{position:absolute;left:0;right:0;bottom:-2px;height:60px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:14px}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;text-align:center}.hero p.lead{margin:0 auto}.hero .actions{justify-content:center}.hero-badge{max-width:260px;grid-row:1}}
/* stats */
.stats{margin-top:-40px;position:relative;z-index:2}
.stats .grid{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:var(--radius);box-shadow:0 10px 30px rgba(20,37,74,.08);overflow:hidden}
.stat{padding:26px 20px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:"Libre Baskerville",serif;font-size:2rem;color:var(--navy)}
.stat span{color:var(--muted);font-size:15px}
@media(max-width:760px){.stats .grid{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}
section{padding:88px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr;gap:28px}}
.about-card{background:var(--navy);color:#dfe6f3;border-radius:var(--radius);padding:34px}
.about-card h3{color:#fff}
.about-card ul{padding-left:18px;margin:0}
.about-card li{margin:6px 0}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:34px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,37,74,.08)}
.card .ico{width:48px;height:48px;border-radius:12px;background:#e6efe7;color:var(--green);display:grid;place-items:center;font-size:24px;margin-bottom:14px}
.card h3{font-size:1.15rem}
.card p{margin:0;color:var(--muted)}
.bg-white{background:#fff}
/* steps */
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin-top:34px}
.step{position:relative;padding:28px 24px 24px;border-radius:var(--radius);background:var(--cream);border:1px solid var(--line)}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-16px;left:22px;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700}
.step h3{font-size:1.1rem;margin-top:6px}
.step p{margin:0;color:var(--muted)}
/* trusts */
.trusts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.trusts span{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:15px;color:var(--navy)}
/* news */
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:34px}
.post{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.post .top{height:8px;background:linear-gradient(90deg,var(--navy),var(--green),var(--water))}
.post .body{padding:24px}
.post time{font-size:14px;color:var(--green);font-weight:600}
.post h3{font-size:1.15rem;margin-top:6px}
.post p{color:var(--muted);margin:0}
/* trustees */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:30px}
.person{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.person b{display:block;color:var(--navy);font-size:15px}
.person small{color:var(--muted)}
/* apply form */
.form{background:#fff;border-radius:var(--radius);padding:32px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(20,37,74,.06)}
.form label{display:block;font-weight:600;font-size:15px;color:var(--navy);margin:14px 0 6px}
.form input,.form select,.form textarea{width:100%;padding:12px 14px;border:1px solid #cfd3dc;border-radius:10px;font:inherit;font-size:16px;background:#fbfbfc}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--water);border-color:var(--water)}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.form .row{grid-template-columns:1fr}}
.notice{display:none;margin-top:16px;padding:14px;border-radius:10px;background:#e6efe7;color:var(--green);font-weight:600}
.contact-list{list-style:none;padding:0;margin:20px 0 0}
.contact-list li{display:flex;gap:14px;margin:14px 0;align-items:flex-start}
.contact-list .ico{flex:none;width:40px;height:40px;border-radius:10px;background:#e8eef8;color:var(--navy);display:grid;place-items:center}
/* footer */
footer{background:var(--navy);color:#b9c4da;padding:56px 0 28px;font-size:15px}
footer .grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:36px}
footer h4{color:#fff;font-family:"Libre Baskerville",serif;margin:0 0 12px}
footer a{color:#dfe6f3;text-decoration:none}
footer .legal{border-top:1px solid rgba(255,255,255,.12);margin-top:36px;padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer img{width:84px;background:#fff;border-radius:50%;padding:4px}
@media(max-width:760px){footer .grid{grid-template-columns:1fr}}
.admin-fab{position:fixed;right:20px;bottom:20px;z-index:40;background:var(--green);color:#fff;border:0;border-radius:999px;padding:13px 20px;font-weight:700;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.2);cursor:pointer;font-family:inherit}

/* ===== ADMIN ===== */
#admin{position:fixed;inset:0;z-index:100;background:#f1f3f7;display:none;font-size:15px}
#admin.open{display:grid;grid-template-columns:250px 1fr}
.a-side{background:#101c38;color:#c5cee0;display:flex;flex-direction:column;overflow:auto}
.a-side .a-brand{display:flex;gap:10px;align-items:center;padding:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.a-side .a-brand img{width:40px;background:#fff;border-radius:50%}
.a-side .a-brand b{color:#fff;display:block;font-size:15px}
.a-side button.nav{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:none;border:0;color:inherit;padding:11px 18px;font:inherit;cursor:pointer;border-left:3px solid transparent}
.a-side button.nav:hover{background:rgba(255,255,255,.05)}
.a-side button.nav.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:#5fb36d}
.a-side .grow{flex:1}
.a-side .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:8px}
.a-main{overflow:auto;display:flex;flex-direction:column}
.a-top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e6ec;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;z-index:2;gap:10px;flex-wrap:wrap}
.a-top h2{font-family:"Source Sans 3",sans-serif;font-size:20px;margin:0}
.a-body{padding:28px;max-width:980px;width:100%}
.panel{background:#fff;border:1px solid #e3e6ec;border-radius:12px;padding:22px;margin-bottom:18px}
.panel h3{font-family:"Source Sans 3",sans-serif;font-size:16px;margin-bottom:12px}
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:600;color:#36405a;margin-bottom:5px;font-size:14px}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 12px;border:1px solid #d4d9e3;border-radius:8px;font:inherit}
.fld textarea{min-height:90px;resize:vertical}
.fld input[type=color]{width:56px;height:38px;padding:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){#admin.open{grid-template-columns:1fr;grid-template-rows:auto 1fr}.a-side{flex-direction:row;overflow-x:auto}.a-side .a-brand,.a-side .foot,.a-side .grow{display:none}.a-side button.nav{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.a-side button.nav.active{border-bottom-color:#5fb36d}.grid2,.grid3{grid-template-columns:1fr}}
.item{border:1px solid #e3e6ec;border-radius:10px;padding:14px;margin-bottom:12px;background:#fafbfc}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.item-head b{color:#36405a}
.ibtn{border:1px solid #d4d9e3;background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
.ibtn:hover{background:#f0f2f6}
.ibtn.del{color:#b3261e;border-color:#efc5c2}
.abtn{border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.abtn.pri{background:#2f6b3a;color:#fff}
.abtn.sec{background:#e8ebf1;color:#1d2433}
.abtn.dan{background:#fbe9e7;color:#b3261e}
.a-side .abtn{width:100%}
.toggle{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef0f4}
.toggle:last-child{border-bottom:0}
.toggle input{width:18px;height:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#101c38;color:#fff;padding:11px 20px;border-radius:999px;z-index:200;transition:.25s;font-weight:600;font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0)}
.hint{color:#6b7385;font-size:13px;margin-top:4px}
table.apps{width:100%;border-collapse:collapse;font-size:14px}
table.apps th,table.apps td{text-align:left;padding:10px;border-bottom:1px solid #eef0f4;vertical-align:top}
table.apps th{color:#6b7385;font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.new{background:#e8eef8;color:#14254a}.pill.approved{background:#e6efe7;color:#2f6b3a}.pill.declined{background:#fbe9e7;color:#b3261e}.pill.review{background:#fff4dc;color:#8a5a00}
#login{position:fixed;inset:0;z-index:150;background:rgba(16,28,56,.6);display:none;place-items:center;padding:20px}
#login.open{display:grid}
#login .box{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:380px;text-align:center}
#login img{width:90px}
#login input{width:100%;padding:11px;border:1px solid #d4d9e3;border-radius:8px;font:inherit;margin:14px 0 6px}
.err{color:#b3261e;font-size:14px;min-height:20px}
textarea.code{font-family:ui-monospace,monospace;font-size:12px;min-height:220px}
</style>
</head>
<body>

<div class="mock-bar" id="mockBar"><b>Design concept</b> by Saltway Digital · not the live site</div>

<header class="site">
  <div class="wrap">
    <a href="#top" class="brand"><img data-logo alt="DUC logo"><span data-t="site.shortName"></span></a>
    <nav class="main" id="mainNav"></nav>
    <button class="menu-btn" aria-label="Menu" onclick="document.getElementById('mainNav').classList.toggle('open')">☰</button>
  </div>
</header>

<main id="top">
  <section class="hero" id="s-hero" style="padding:0">
    <div class="wrap">
      <div>
        <span class="eyebrow" data-t="hero.eyebrow"></span>
        <h1 data-t="hero.title"></h1>
        <p class="lead" data-t="hero.text"></p>
        <div class="actions">
          <a class="btn btn-primary" href="#apply" data-t="hero.btn1"></a>
          <a class="btn btn-ghost" href="#about" data-t="hero.btn2"></a>
        </div>
      </div>
      <img class="hero-badge" data-logo alt="Droitwich Spa United Charities badge">
    </div>
    <svg class="ripple" viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0 30 C 240 60 480 0 720 30 S 1200 60 1440 30 V60 H0Z" fill="var(--cream)"/></svg>
  </section>

  <div class="stats wrap" id="s-stats"><div class="grid" id="statsGrid"></div></div>

  <section id="about">
    <div class="wrap two">
      <div>
        <span class="eyebrow" data-t="about.eyebrow"></span>
        <h2 data-t="about.title"></h2>
        <div id="aboutText"></div>
      </div>
      <div class="about-card">
        <h3 data-t="about.cardTitle"></h3>
        <ul id="aboutList"></ul>
      </div>
    </div>
  </section>

  <section id="grants" class="bg-white">
    <div class="wrap">
      <span class="eyebrow" data-t="grants.eyebrow"></span>
      <h2 data-t="grants.title"></h2>
      <p data-t="grants.intro" style="max-width:720px;color:var(--muted)"></p>
      <div class="cards" id="grantCards"></div>
    </div>
  </section>

  <section id="how">
    <div class="wrap">
      <span class="eyebrow" data-t="how.eyebrow"></span>
      <h2 data-t="how.title"></h2>
      <div class="steps" id="stepsList"></div>
    </div>
  </section>

  <section id="history" class="bg-white">
    <div class="wrap">
      <span class="eyebrow" data-t="history.eyebrow"></span>
      <h2 data-t="history.title"></h2>
      <p data-t="history.text" style="max-width:760px;color:var(--muted)"></p>
      <div class="trusts" id="trustList"></div>
    </div>
  </section>

  <section id="news">
    <div class="wrap">
      <span class="eyebrow" data-t="news.eyebrow"></span>
      <h2 data-t="news.title"></h2>
      <div class="news" id="newsList"></div>
    </div>
  </section>

  <section id="trustees" class="bg-white">
    <div class="wrap">
      <span class="eyebrow" data-t="trustees.eyebrow"></span>
      <h2 data-t="trustees.title"></h2>
      <p data-t="trustees.intro" style="max-width:720px;color:var(--muted)"></p>
      <div class="people" id="peopleList"></div>
    </div>
  </section>

  <section id="apply">
    <div class="wrap two">
      <div>
        <span class="eyebrow" data-t="apply.eyebrow"></span>
        <h2 data-t="apply.title"></h2>
        <p data-t="apply.text" style="color:var(--muted)"></p>
        <ul class="contact-list" id="contactList"></ul>
      </div>
      <form class="form" id="applyForm">
        <h3 data-t="apply.formTitle"></h3>
        <div class="row">
          <div><label>Your name</label><input name="name" required></div>
          <div><label>Phone or email</label><input name="contact" required></div>
        </div>
        <label>Applying as</label>
        <select name="type"><option>An individual</option><option>On behalf of someone</option><option>A local organisation</option></select>
        <label>Postcode</label><input name="postcode" placeholder="e.g. WR9 …" required>
        <label>What is the grant for?</label><textarea name="purpose" rows="4" required></textarea>
        <label>Amount requested (£)</label><input name="amount" type="number" min="0">
        <div style="margin-top:20px"><button class="btn btn-primary" type="submit" data-t="apply.button"></button></div>
        <div class="notice" id="applyOk" data-t="apply.thanks"></div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="grid">
      <div><img data-logo alt=""><p data-t="footer.text" style="max-width:420px"></p></div>
      <div><h4>Explore</h4><div id="footNav" style="display:grid;gap:6px"></div></div>
      <div><h4>Contact</h4><div id="footContact" style="display:grid;gap:6px"></div></div>
    </div>
    <div class="legal"><span id="legalLine"></span><span data-t="footer.credit"></span></div>
  </div>
</footer>

<button class="admin-fab" onclick="openAdmin()">⚙ Admin</button>

<!-- LOGIN -->
<div id="login"><div class="box">
  <img data-logo alt="">
  <h3 style="font-family:'Source Sans 3';margin-top:10px">Admin sign in</h3>
  <input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="err" id="pwErr"></div>
  <div class="hint">Mockup password: <b>duc2026</b> (change it under Settings)</div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:16px">
    <button class="abtn sec" onclick="closeLogin()">Cancel</button><button class="abtn pri" onclick="doLogin()">Sign in</button>
  </div>
</div></div>

<!-- ADMIN -->
<div id="admin">
  <aside class="a-side">
    <div class="a-brand"><img data-logo alt=""><div><b>DUC Admin</b><small>Website editor</small></div></div>
    <div id="aNav"></div>
    <div class="grow"></div>
    <div class="foot">
      <button class="abtn pri" onclick="closeAdmin()">View site</button>
      <button class="abtn sec" onclick="logout()">Sign out</button>
    </div>
  </aside>
  <div class="a-main">
    <div class="a-top"><h2 id="aTitle"></h2>
      <div style="display:flex;gap:8px"><span class="hint" id="saveState">All changes saved</span><button class="abtn sec" onclick="closeAdmin()">Preview ↗</button></div>
    </div>
    <div class="a-body" id="aBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const LOGO_DEFAULT = "duc-logo.webp";
const DEFAULTS = {
  settings:{password:"duc2026", showMockBar:true},
  theme:{navy:"#14254a",green:"#2f6b3a",water:"#7fa8d6",cream:"#f7f5ef",headingFont:"Libre Baskerville",bodyFont:"Source Sans 3"},
  logo:"",
  sections:{stats:true,about:true,grants:true,how:true,history:true,news:true,trustees:true,apply:true},
  site:{shortName:"Droitwich United Charities<small>DROITWICH SPA · EST. 1912</small>",charityNo:"205536",phone:"01905 775226",email:"",address:"26 Blackfriars Avenue, Droitwich, WR9 8RQ"},
  nav:[{label:"About",href:"#about"},{label:"Grants",href:"#grants"},{label:"How to apply",href:"#how"},{label:"Our history",href:"#history"},{label:"News",href:"#news"},{label:"Trustees",href:"#trustees"},{label:"Contact",href:"#apply"}],
  hero:{eyebrow:"Registered charity 205536",title:"Small grants that make a big difference in Droitwich Spa",text:"We give small grants to people and organisations within Droitwich Spa, to support those who are struggling with everyday life.",btn1:"Apply for a grant",btn2:"About us"},
  stats:[{value:"1912",label:"Scheme established"},{value:"16",label:"Historic trusts united"},{value:"11",label:"Volunteer trustees"},{value:"100%",label:"Local to Droitwich Spa"}],
  about:{eyebrow:"Who we are",title:"Generations of local generosity, working together",
    text:"Droitwich United Charities brings together a number of historic local trusts, each left by people who wanted to help the town they loved.\n\nToday a group of volunteer trustees manages those funds together and gives small grants for the general benefit of people in need within the old Borough of Droitwich.",
    cardTitle:"Who we help",list:["Children and young people","Older people","People with disabilities","Local charities and voluntary groups","Anyone facing hardship within Droitwich Spa"]},
  grants:{eyebrow:"What we fund",title:"How a grant can help",intro:"Grants are usually small and practical. Here are some of the things we have helped with in the past.",
    items:[{icon:"👕",title:"School uniforms",text:"Helping families with the cost of uniform and school essentials."},
      {icon:"♿",title:"Disability equipment",text:"Contributing to equipment that makes everyday life easier."},
      {icon:"🏠",title:"Emergencies & flooding",text:"Support for local residents affected by flooding and sudden hardship."},
      {icon:"🤝",title:"Local organisations",text:"Gifts to groups like the Foodbank, Salvation Army and care homes."}]},
  how:{eyebrow:"Applying",title:"How to apply",
    steps:[{title:"Check you're eligible",text:"You must live in, or your group must serve, the Droitwich Spa area."},
      {title:"Tell us what you need",text:"Fill in the short form on this page, or call us if you'd rather talk."},
      {title:"Trustees review",text:"Our trustees consider applications at their regular meetings."},
      {title:"We'll be in touch",text:"We'll let you know the outcome and arrange any grant."}]},
  history:{eyebrow:"Our history",title:"The trusts behind the charity",text:"Our governing scheme dates from 5 November 1912 and was amended in 1936. The charity was registered on 11 May 1962. These are the people whose gifts live on through our work:",
    trusts:["Talbot Barker","William Haseldine","Mary Hickman","Hannah Sophia Lea","Reverend William Lea","Venerable William Lea","Nathaniel George Petre","Harriet Ricketts","Catherine Talbot","Giles Trimnall","Mary Wakeman","John Cole Wedgeberrow","Sarah Roberts","Thomas Groves Smith","Elizabeth Smithsend","William Squire"]},
  news:{eyebrow:"News",title:"Latest from DUC",
    items:[{date:"December 2017",title:"Christmas boost for the Foodbank and Salvation Army",text:"Droitwich Spa Foodbank and the town's Salvation Army each received £170 as a Christmas gift from the charity."},
      {date:"Add a date",title:"Your next news story",text:"Use the admin panel to add news, grant announcements and appeals."}]},
  trustees:{eyebrow:"Our people",title:"Our trustees",intro:"The charity is run entirely by volunteers from the local community.",
    people:[{name:"Richard Morris",role:"Chair"},{name:"Anthony Archer",role:"Trustee"},{name:"Susan Brazier",role:"Trustee"},{name:"Denise Bryant",role:"Trustee"},{name:"Wendy Carter",role:"Trustee"},{name:"J L Clarke",role:"Trustee"},{name:"Margaret Collins",role:"Trustee"},{name:"John Dayer MBE",role:"Trustee"},{name:"Paul Karakashian",role:"Trustee"},{name:"Brendan Keane",role:"Trustee"},{name:"Elizabeth Taft",role:"Trustee"}]},
  apply:{eyebrow:"Get in touch",title:"Apply or ask a question",text:"Grants are for people and organisations within the Droitwich Spa area. If you're not sure whether you qualify, just get in touch.",formTitle:"Grant enquiry",button:"Send enquiry",thanks:"Thank you — your enquiry has been received. A trustee will be in touch."},

let S;
function load(){try{const r=localStorage.getItem("duc_site");S=r?merge(structuredClone(DEFAULTS),JSON.parse(r)):structuredClone(DEFAULTS);}catch(e){S=structuredClone(DEFAULTS);}}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")merge(a[k],b[k]);else a[k]=b[k];}return a;}
let saveT;function save(){document.getElementById("saveState").textContent="Saving…";clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem("duc_site",JSON.stringify(S));document.getElementById("saveState").textContent="All changes saved";}catch(e){document.getElementById("saveState").textContent="Couldn't save in this browser — use Backup";}},300);render();}
const get=(p)=>p.split(".").reduce((o,k)=>o?.[k],S);
const set=(p,v)=>{const ks=p.split(".");let o=S;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=v;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const allowSmall=s=>esc(s).replace(/&lt;small&gt;/g,"<small>").replace(/&lt;\/small&gt;/g,"</small>");
const initials=n=>n.split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)&&w!=="MBE").map(w=>w[0]).slice(0,2).join("").toUpperCase();

function render(){
  const r=document.documentElement.style,t=S.theme;
  r.setProperty("--navy",t.navy);r.setProperty("--green",t.green);r.setProperty("--water",t.water);r.setProperty("--cream",t.cream);
  document.querySelectorAll("main h1,main h2,main h3,.brand span,footer h4").forEach(e=>e.style.fontFamily=`"${t.headingFont}",Georgia,serif`);
  document.body.style.fontFamily=`"${t.bodyFont}",system-ui,sans-serif`;
  document.querySelectorAll("[data-logo]").forEach(i=>i.src=S.logo||LOGO_DEFAULT);
  document.querySelectorAll("[data-t]").forEach(e=>{const v=get(e.dataset.t);e.innerHTML=e.dataset.t==="site.shortName"?allowSmall(v):esc(v);});
  document.getElementById("mockBar").style.display=S.settings.showMockBar?"":"none";
  for(const k in S.sections){const el=document.getElementById(k==="stats"?"s-stats":k);if(el)el.style.display=S.sections[k]?"":"none";}
  const navHtml=S.nav.map(n=>`<a href="${esc(n.href)}">${esc(n.label)}</a>`).join("");
  document.getElementById("mainNav").innerHTML=navHtml;document.getElementById("footNav").innerHTML=navHtml;
  document.getElementById("statsGrid").innerHTML=S.stats.map(s=>`<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("");
  document.getElementById("aboutText").innerHTML=S.about.text.split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join("");
  document.getElementById("aboutList").innerHTML=S.about.list.map(l=>`<li>${esc(l)}</li>`).join("");
  document.getElementById("grantCards").innerHTML=S.grants.items.map(g=>`<div class="card"><div class="ico">${esc(g.icon)}</div><h3>${esc(g.title)}</h3><p>${esc(g.text)}</p></div>`).join("");
  document.getElementById("stepsList").innerHTML=S.how.steps.map(s=>`<div class="step"><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join("");
  document.getElementById("trustList").innerHTML=S.history.trusts.map(t=>`<span>${esc(t)}</span>`).join("");
  document.getElementById("newsList").innerHTML=S.news.items.map(n=>`<article class="post"><div class="top"></div><div class="body"><time>${esc(n.date)}</time><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></div></article>`).join("");
  document.getElementById("peopleList").innerHTML=S.trustees.people.map(p=>`<div class="person"><div class="avatar">${esc(initials(p.name))}</div><div><b>${esc(p.name)}</b><small>${esc(p.role)}</small></div></div>`).join("");
  const c=S.site,ci=[["📞","Phone",c.phone],["✉️","Email",c.email],["📍","Address",c.address],["🏛️","Registered charity",c.charityNo]].filter(x=>x[2]);
  document.getElementById("contactList").innerHTML=ci.map(x=>`<li><span class="ico">${x[0]}</span><div><b>${x[1]}</b><br>${esc(x[2])}</div></li>`).join("");
  document.getElementById("footContact").innerHTML=[c.phone,c.email,c.address].filter(Boolean).map(esc).map(s=>`<span>${s}</span>`).join("");
  document.getElementById("legalLine").textContent=`© ${new Date().getFullYear()} Droitwich United Charities · Registered charity no. ${c.charityNo}`;
}

document.getElementById("applyForm").addEventListener("submit",e=>{
  e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f);o.date=new Date().toLocaleDateString("en-GB");o.status="new";o.id=Date.now();
  S.applications.unshift(o);save();e.target.reset();const n=document.getElementById("applyOk");n.style.display="block";setTimeout(()=>n.style.display="none",6000);
});

/* ===== Admin ===== */
let authed=false,cur="dashboard";
function openAdmin(){if(authed){showAdmin();}else{document.getElementById("login").classList.add("open");setTimeout(()=>document.getElementById("pw").focus(),50);}}
function closeLogin(){document.getElementById("login").classList.remove("open");document.getElementById("pwErr").textContent="";}
function doLogin(){const p=document.getElementById("pw");if(p.value===S.settings.password){authed=true;p.value="";closeLogin();showAdmin();}else{document.getElementById("pwErr").textContent="Incorrect password";}}
function logout(){authed=false;closeAdmin();}
function showAdmin(){document.getElementById("admin").classList.add("open");document.body.style.overflow="hidden";renderAdmin();}
function closeAdmin(){document.getElementById("admin").classList.remove("open");document.body.style.overflow="";}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}

const PAGES=[
 ["dashboard","📊","Dashboard"],["applications","📥","Enquiries"],["branding","🎨","Branding & colours"],["general","🏛️","Charity details"],["navigation","🧭","Menu"],["sections","👁️","Show / hide sections"],
 ["hero","🌊","Hero banner"],["stats","🔢","Key figures"],["about","ℹ️","About"],["grants","💷","Grants"],["how","📝","How to apply"],["history","📜","History & trusts"],
 ["news","📰","News"],["trustees","👥","Trustees"],["apply","✉️","Contact & form"],["footer","⬇️","Footer"],["settings","🔐","Settings & backup"]];

function fld(path,label,type="text",hint=""){const v=get(path)??"";const id="f_"+path.replace(/\./g,"_");
  const input=type==="textarea"?`<textarea id="${id}" oninput="upd('${path}',this.value)">${esc(v)}</textarea>`
   :`<input id="${id}" type="${type}" value="${esc(v)}" oninput="upd('${path}',this.value)">`;
  return `<div class="fld"><label for="${id}">${label}</label>${input}${hint?`<div class="hint">${hint}</div>`:""}</div>`;}
function upd(p,v){set(p,v);save();}

/* generic list editor */
function listEd(path,fields,newItem,titleKey){const arr=get(path);
  const items=arr.map((it,i)=>{const isStr=typeof it==="string";
    const inner=isStr?`<div class="fld"><input value="${esc(it)}" oninput="updItem('${path}',${i},null,this.value)"></div>`
      :fields.map(([k,l,t])=>`<div class="fld"><label>${l}</label>${t==="textarea"?`<textarea oninput="updItem('${path}',${i},'${k}',this.value)">${esc(it[k])}</textarea>`:`<input value="${esc(it[k])}" oninput="updItem('${path}',${i},'${k}',this.value)">`}</div>`).join("");
    return `<div class="item"><div class="item-head"><b>${isStr?"#"+(i+1):esc(it[titleKey]||"Item "+(i+1))}</b><div style="display:flex;gap:6px">
      <button class="ibtn" onclick="mv('${path}',${i},-1)" ${i===0?"disabled":""}>↑</button><button class="ibtn" onclick="mv('${path}',${i},1)" ${i===arr.length-1?"disabled":""}>↓</button>
      <button class="ibtn del" onclick="rm('${path}',${i})">Remove</button></div></div>${inner}</div>`;}).join("");
  return items+`<button class="abtn sec" onclick='addItem("${path}",${JSON.stringify(newItem)})'>+ Add</button>`;}
function updItem(p,i,k,v){const a=get(p);if(k===null)a[i]=v;else a[i][k]=v;save();}
function mv(p,i,d){const a=get(p);[a[i],a[i+d]]=[a[i+d],a[i]];save();renderAdmin();}
function rm(p,i){get(p).splice(i,1);save();renderAdmin();toast("Removed");}
function addItem(p,n){get(p).push(structuredClone(n));save();renderAdmin();}
const panel=(t,h)=>`<div class="panel"><h3>${t}</h3>${h}</div>`;

function renderAdmin(){
  document.getElementById("aNav").innerHTML=PAGES.map(([k,i,l])=>`<button class="nav ${k===cur?"active":""}" onclick="cur='${k}';renderAdmin()">${i} ${l}${k==="applications"&&S.applications.filter(a=>a.status==="new").length?` <span class="pill new" style="margin-left:auto">${S.applications.filter(a=>a.status==="new").length}</span>`:""}</button>`).join("");
  document.getElementById("aTitle").textContent=PAGES.find(p=>p[0]===cur)[2];
  const B=document.getElementById("aBody");let h="";
  switch(cur){
   case "dashboard":{const a=S.applications;h=`<div class="grid3">${[["Enquiries",a.length],["Awaiting review",a.filter(x=>x.status==="new"||x.status==="review").length],["News posts",S.news.items.length]].map(([l,v])=>`<div class="panel" style="text-align:center"><div style="font-size:30px;font-weight:700;color:#14254a">${v}</div><div class="hint">${l}</div></div>`).join("")}</div>`+
     panel("Quick links",`<div style="display:flex;flex-wrap:wrap;gap:8px">${PAGES.slice(1).map(([k,i,l])=>`<button class="abtn sec" onclick="cur='${k}';renderAdmin()">${i} ${l}</button>`).join("")}</div>`)+
     panel("About this mockup",`<p style="margin:0">Every word, colour, image and list on the site can be changed here and appears straight away. Changes are kept in this browser; use <b>Settings & backup</b> to copy the content out or load it on another device.</p>`);break;}
   case "applications":{const a=S.applications;h=panel("Grant enquiries",a.length?`<table class="apps"><tr><th>Date</th><th>Applicant</th><th>Request</th><th>Status</th><th></th></tr>${a.map((x,i)=>`<tr><td>${esc(x.date)}</td><td><b>${esc(x.name)}</b><br><span class="hint">${esc(x.contact)} · ${esc(x.postcode)}<br>${esc(x.type)}</span></td><td>${esc(x.purpose)}${x.amount?`<br><b>£${esc(x.amount)}</b>`:""}</td><td><select onchange="S.applications[${i}].status=this.value;save();renderAdmin()">${["new","review","approved","declined"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select><br><span class="pill ${x.status}" style="margin-top:6px">${x.status}</span></td><td><button class="ibtn del" onclick="rm('applications',${i})">Delete</button></td></tr>`).join("")}</table>`:`<p class="hint">No enquiries yet. Submit the form on the site to see one appear here.</p>`);break;}
   case "branding":h=panel("Logo",`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><img src="${S.logo||LOGO_DEFAULT}" style="width:110px;border:1px solid #eee;border-radius:12px;padding:6px"><div><input type="file" accept="image/*" onchange="upLogo(this)"><div class="hint">PNG or SVG with a transparent background works best.</div>${S.logo?`<button class="abtn sec" style="margin-top:8px" onclick="S.logo='';save();renderAdmin()">Restore original logo</button>`:""}</div></div>`)+
     panel("Colours",`<div class="grid2">${[["navy","Main (navy)"],["green","Accent (green)"],["water","Highlight (water blue)"],["cream","Page background"]].map(([k,l])=>`<div class="fld"><label>${l}</label><div style="display:flex;gap:8px;align-items:center"><input type="color" value="${S.theme[k]}" oninput="upd('theme.${k}',this.value);this.nextElementSibling.value=this.value"><input value="${S.theme[k]}" oninput="upd('theme.${k}',this.value)" style="max-width:120px"></div></div>`).join("")}</div><button class="abtn sec" onclick="S.theme={...DEFAULTS.theme};save();renderAdmin()">Reset to logo colours</button>`)+
     panel("Fonts",`<div class="grid2"><div class="fld"><label>Headings</label><select onchange="upd('theme.headingFont',this.value)">${["Libre Baskerville","Source Sans 3","Georgia"].map(f=>`<option ${S.theme.headingFont===f?"selected":""}>${f}</option>`).join("")}</select></div><div class="fld"><label>Body text</label><select onchange="upd('theme.bodyFont',this.value)">${["Source Sans 3","Libre Baskerville","Georgia"].map(f=>`<option ${S.theme.bodyFont===f?"selected":""}>${f}</option>`).join("")}</select></div></div>`);break;
   case "general":h=panel("Charity details",fld("site.shortName","Header name","text","Text inside &lt;small&gt;…&lt;/small&gt; shows as the small strapline.")+`<div class="grid2">`+fld("site.charityNo","Charity number")+fld("site.phone","Phone")+fld("site.email","Email","email","Leave blank to hide")+fld("site.address","Address")+`</div>`);break;
   case "navigation":h=panel("Menu links",listEd("nav",[["label","Label"],["href","Link (e.g. #grants or https://…)"]],{label:"New link",href:"#"},"label"));break;
   case "sections":h=panel("Visible sections",Object.keys(S.sections).map(k=>`<label class="toggle"><input type="checkbox" ${S.sections[k]?"checked":""} onchange="S.sections['${k}']=this.checked;save()"> ${PAGES.find(p=>p[0]===k)?.[2]||k}</label>`).join(""));break;
   case "hero":h=panel("Hero banner",fld("hero.eyebrow","Small label")+fld("hero.title","Headline")+fld("hero.text","Intro text","textarea")+`<div class="grid2">`+fld("hero.btn1","Main button")+fld("hero.btn2","Second button")+`</div>`);break;
   case "stats":h=panel("Key figures",listEd("stats",[["value","Figure"],["label","Label"]],{value:"0",label:"New figure"},"label"));break;
   case "about":h=panel("Text",fld("about.eyebrow","Small label")+fld("about.title","Heading")+fld("about.text","Body","textarea","Leave a blank line between paragraphs."))+panel("Side panel",fld("about.cardTitle","Panel heading")+listEd("about.list",[],"New line"));break;
   case "grants":h=panel("Intro",fld("grants.eyebrow","Small label")+fld("grants.title","Heading")+fld("grants.intro","Intro","textarea"))+panel("Grant types",listEd("grants.items",[["icon","Icon (emoji)"],["title","Title"],["text","Description","textarea"]],{icon:"⭐",title:"New grant type",text:""},"title"));break;
   case "how":h=panel("Intro",fld("how.eyebrow","Small label")+fld("how.title","Heading"))+panel("Steps",listEd("how.steps",[["title","Step title"],["text","Description","textarea"]],{title:"New step",text:""},"title"));break;
   case "history":h=panel("Text",fld("history.eyebrow","Small label")+fld("history.title","Heading")+fld("history.text","Body","textarea"))+panel("Trusts",listEd("history.trusts",[],"New trust"));break;
   case "news":h=panel("Intro",fld("news.eyebrow","Small label")+fld("news.title","Heading"))+panel("Posts (top shows first)",listEd("news.items",[["date","Date"],["title","Headline"],["text","Story","textarea"]],{date:new Date().toLocaleDateString("en-GB",{month:"long",year:"numeric"}),title:"New story",text:""},"title"));break;
   case "trustees":h=panel("Intro",fld("trustees.eyebrow","Small label")+fld("trustees.title","Heading")+fld("trustees.intro","Intro","textarea"))+panel("People",listEd("trustees.people",[["name","Name"],["role","Role"]],{name:"New trustee",role:"Trustee"},"name"));break;
   case "apply":h=panel("Contact section",fld("apply.eyebrow","Small label")+fld("apply.title","Heading")+fld("apply.text","Text","textarea"))+panel("Form",fld("apply.formTitle","Form heading")+fld("apply.button","Button text")+fld("apply.thanks","Thank-you message","textarea"));break;
   case "footer":h=panel("Footer",fld("footer.text","Footer text","textarea")+fld("footer.credit","Credit line"))+panel("Mockup banner",`<label class="toggle"><input type="checkbox" ${S.settings.showMockBar?"checked":""} onchange="S.settings.showMockBar=this.checked;save()"> Show “Design concept” bar at top of page</label>`);break;
   case "settings":h=panel("Admin password",fld("settings.password","Password","text","Mockup only — real sign-in would be server-side on the live site."))+
     panel("Backup & move content",`<p class="hint" style="margin-top:0">Copy this to keep a backup or move your edits to another browser. Paste content in and press Load to restore.</p><textarea class="code" id="jsonBox">${esc(JSON.stringify({...S,logo:S.logo?"(custom logo – kept in this browser)":""},null,2))}</textarea><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="abtn sec" onclick="copyJson()">Copy</button><button class="abtn pri" onclick="loadJson()">Load</button></div>`)+
     panel("Reset",`<button class="abtn dan" onclick="if(document.getElementById('rc').value==='RESET'){S=structuredClone(DEFAULTS);save();renderAdmin();toast('Site reset')}else toast('Type RESET first')">Reset everything to default</button> <input id="rc" placeholder="Type RESET" style="padding:8px;border:1px solid #d4d9e3;border-radius:8px;margin-left:8px">`);break;
  }
  B.innerHTML=h;
}
function upLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;save();renderAdmin();toast("Logo updated");};r.readAsDataURL(f);}
function copyJson(){navigator.clipboard.writeText(document.getElementById("jsonBox").value).then(()=>toast("Copied"),()=>{document.getElementById("jsonBox").select();toast("Press Ctrl+C to copy");});}
function loadJson(){try{const o=JSON.parse(document.getElementById("jsonBox").value);const logo=S.logo;S=merge(structuredClone(DEFAULTS),o);if(typeof S.logo!=="string"||!S.logo.startsWith("data:"))S.logo=logo;save();renderAdmin();toast("Content loaded");}catch(e){toast("That doesn't look like valid content");}}

load();render();
</script>
