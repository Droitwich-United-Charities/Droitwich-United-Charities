   <div class="row"><div><label class="l">From address</label><input id="mF" value="${esc(s.smtp.from)}" placeholder="clerk@droitwichunitedcharities.org.uk"></div><div><label class="l">From name</label><input id="mN" value="${esc(s.smtp.fromName)}"></div><div><label class="l">Reply-to (optional)</label><input id="mR" value="${esc(s.smtp.replyTo)}"></div></div>
   <div class="row" style="margin-top:10px"><input id="mT" placeholder="Send a test email to…" value="${esc(ME.user.email)}"><button class="btn sec fit" onclick="testMail()">Save & send test</button></div>
   ${s.outbox.length?`<h3 style="margin-top:12px">Waiting to send (${s.outbox.length})</h3><table class="t">${s.outbox.map(o=>`<tr><td>${esc(o.to)}</td><td>${esc(o.subject)}</td><td class="hint">${o.tries} tries · ${esc(o.error)}</td></tr>`).join("")}</table>`:""}</div>
  <div class="card"><h2>AI for meeting notes</h2><p class="hint">Two jobs: turning the recording into text, then writing the summary, decisions, actions and draft minutes. Pick a service for each.</p>
   <div class="row"><div><label class="l">Transcription (recording → text)</label><select id="aiS" onchange="aiShow()"><option value="gemini" ${s.ai.stt==="gemini"?"selected":""}>Gemini</option><option value="whisper" ${s.ai.stt==="whisper"?"selected":""}>Whisper – Groq (free) or your own Whisper server</option></select></div>
    <div><label class="l">Notes, actions and minutes</label><select id="aiN" onchange="aiShow()"><option value="gemini" ${s.ai.notes==="gemini"?"selected":""}>Gemini</option><option value="ollama" ${s.ai.notes==="ollama"?"selected":""}>Saltway AI (Ollama on your VPS)</option></select></div></div>
   <div id="aiW" class="agenda-item" style="margin-top:10px"><b>Whisper</b><p class="hint">Groq: sign up free at console.groq.com → API Keys → Create API Key. Whisper doesn't say who is speaking, so the Clerk checks action owners.</p>
    <div class="row"><div><label class="l">Address</label><input id="wB" value="${esc(s.ai.whisper.base)}"></div><div><label class="l">API key</label><input id="wK" value="${esc(s.ai.whisper.key)}" autocomplete="off" placeholder="gsk_…"></div><div style="flex:0 0 220px"><label class="l">Model</label><input id="wM" value="${esc(s.ai.whisper.model)}"></div></div></div>
   <div id="aiO" class="agenda-item" style="margin-top:10px"><b>Saltway AI (Ollama)</b><p class="hint">The address Caddy gives Ollama on your VPS, the API key you set in Caddy, and the model you've pulled (for example llama3.2:1b, llama3.2:3b or llama3.1:8b). Notes are written in the background and the Clerk is emailed when they're ready.</p>
    <div class="row"><div><label class="l">Address</label><input id="oB" value="${esc(s.ai.ollama.base)}"></div><div><label class="l">API key</label><input id="oK" value="${esc(s.ai.ollama.key)}" autocomplete="off"></div></div>
    <div class="row"><div><label class="l">Model</label><input id="oM" value="${esc(s.ai.ollama.model)}"></div><div><label class="l">Context size (tokens)</label><input id="oC" type="number" value="${s.ai.ollama.ctx}"><span class="hint">32768 fits about 2 hours of meeting. Lower it if the VPS runs short of memory.</span></div>
     <div><label class="l">How to read the meeting</label><select id="oX"><option value="auto" ${s.ai.ollama.mode==="auto"?"selected":""}>Automatic – a part at a time for small models</option><option value="sections" ${s.ai.ollama.mode==="sections"?"selected":""}>Always a part at a time</option><option value="whole" ${s.ai.ollama.mode==="whole"?"selected":""}>All in one go (8B models and bigger)</option></select><span class="hint">Small models like llama3.2:1b do much better a part at a time. Marking each agenda item while recording gives each item its own section.</span></div></div></div>
   <div id="aiG" class="agenda-item" style="margin-top:10px"><b>Gemini</b><p class="hint">Key from aistudio.google.com, in a Google Cloud project <b>with billing turned on</b> – free-tier data may be used by Google, and Google only allows paid use for UK users.</p>
    <label class="l">API key</label><input id="gK" value="${esc(s.gemini.key)}" autocomplete="off" placeholder="AIza…"><div class="row"><div><label class="l">Fast model (transcripts)</label><input id="gF" value="${esc(s.gemini.fastModel)}"></div><div><label class="l">Pro model (minutes and actions)</label><input id="gP" value="${esc(s.gemini.proModel)}"></div></div></div>
   <div class="row" style="margin-top:10px"><button class="btn sec fit" onclick="testGemini()">Save & test AI</button></div></div>
  <div class="card"><h2>Decisions</h2><label class="l">Votes needed for a decision to be quorate</label><input id="vQ" type="number" min="1" value="${s.votes.quorum}" style="width:120px"><p class="hint">Check this against the governing document. Decisions are by simple majority.</p>
   <label class="l">Droitwich Spa postcode areas (one per line)</label><textarea id="pcs" style="min-height:80px">${esc(s.postcodes.join("\n"))}</textarea><p class="hint">Referrals from other postcodes get a warning, but aren't blocked.</p></div>
  <div class="card"><h2>Who signs letters</h2>${["chairman","clerk"].map(k=>`<h3>${k==="chairman"?"Chairman":"Clerk"}</h3><div class="row"><div><label class="l">Name</label><input id="sg_${k}_name" value="${esc(s.signatories[k].name)}"></div><div><label class="l">Title</label><input id="sg_${k}_role" value="${esc(s.signatories[k].role)}"></div></div><label class="l">Contact line</label><input id="sg_${k}_contact" value="${esc(s.signatories[k].contact)}">`).join("")}<p class="hint">The brand guide says these details came from 2016 letters – please check they're still correct.</p></div>
  <div class="card"><h2>Data sharing agreement for partners (version ${s.agreement.version})</h2><textarea id="agT" style="min-height:260px">${esc(s.agreement.text)}</textarea><p class="hint">Saving a change creates a new version. Every partner's main contact must accept it again.</p></div>
  <div class="card"><h2>Cron job (reminders, retention, retries)</h2><p>In cPanel, open <b>Cron Jobs</b> and add one job to run <b>every 15 minutes</b>:</p><input readonly value="${esc(s.cronCommand)}" onclick="this.select()"><p class="hint">If your host doesn't allow that, use this web address with "wget" or an online cron service instead (keep it secret):</p><input readonly value="${esc(s.cronUrl)}" onclick="this.select()"></div>
  <div style="position:sticky;bottom:12px;text-align:right"><button class="btn" onclick="saveSettings()">Save settings</button></div>`;
  aiShow();
};
function settingsBody(){return{siteUrl:$("#sU").value,smtp:{host:$("#mH").value,port:+$("#mP").value,secure:$("#mS").value,user:$("#mU").value,pass:$("#mW").value,from:$("#mF").value,fromName:$("#mN").value,replyTo:$("#mR").value},
  gemini:{key:$("#gK").value,fastModel:$("#gF").value,proModel:$("#gP").value},
  ai:{stt:$("#aiS").value,notes:$("#aiN").value,whisper:{base:$("#wB").value,key:$("#wK").value,model:$("#wM").value},ollama:{base:$("#oB").value,key:$("#oK").value,model:$("#oM").value,ctx:+$("#oC").value,mode:$("#oX").value}},votes:{quorum:+$("#vQ").value},postcodes:$("#pcs").value.split("\n").map(x=>x.trim()).filter(Boolean),
  signatories:Object.fromEntries(["chairman","clerk"].map(k=>[k,{name:$(`#sg_${k}_name`).value,role:$(`#sg_${k}_role`).value,contact:$(`#sg_${k}_contact`).value}])),agreementText:$("#agT").value};}
async function saveSettings(silent){try{await api("PUT","/api/p/settings",settingsBody());if(!silent){toast("Settings saved");await boot();}}catch(e){fail(e);throw e;}}
async function testMail(){try{await saveSettings(true);await api("POST","/api/p/settings/test-email",{to:$("#mT").value});toast("Test email sent – check the inbox");}catch(e){fail(e);}}
async function testGemini(){try{await saveSettings(true);const r=await api("POST","/api/p/settings/test-gemini");modal(`<h2>AI test</h2><p>✅ ${esc(r.reply).replace(/ \| /g,"<br>✅ ")}</p><div style="text-align:right"><button class="btn" onclick="closeModal()">Done</button></div>`);}catch(e){modal(`<h2>AI test</h2><div class="bad">${esc(e.message).replace(/ \| /g,"<br>")}</div><div style="text-align:right"><button class="btn" onclick="closeModal()">Close</button></div>`);}}
function aiShow(){const s=$("#aiS").value,n=$("#aiN").value;$("#aiW").style.display=s==="whisper"?"":"none";$("#aiO").style.display=n==="ollama"?"":"none";$("#aiG").style.display=(s==="gemini"||n==="gemini")?"":"none";}
PAGES.team=async()=>{
  const l=await api("GET","/api/p/board-users");BOARD=l;const can=["admin","clerk"].includes(ME.user.role);
  main().innerHTML=`<div class="head"><h1>Trustees & officers</h1><span class="sp"></span>${can?`<button class="btn fit" onclick="inviteBoard()">+ Invite</button>`:""}</div>
  <div class="card tw"><table class="t"><tr><th>Name</th><th>Role</th><th>Email</th></tr>${l.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.roleLabel)}</td><td>${u.email?`<a href="mailto:${esc(u.email)}">${esc(u.email)}</a>`:`<span class="hint">no email – add one on the website's Users page</span>`}</td></tr>`).join("")}</table></div>
  ${PERMS.admin?`<p class="hint">Change roles, reset passwords or remove people from the website's admin panel (Users).</p>`:""}`;
};
function inviteBoard(){const m=modal(`<h2>Invite to the Trustee Portal</h2><label class="l">Name</label><input id="ibN"><label class="l">Email</label><input id="ibE" type="email"><label class="l">Role</label><select id="ibR"><option value="trustee">Trustee</option>${PERMS.admin?`<option value="chairman">Chairman</option><option value="clerk">Clerk</option><option value="dplead">Data Protection Lead</option>`:""}</select><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sec fit" onclick="closeModal()">Cancel</button><button class="btn fit" id="ibGo">Send invitation</button></div>`);
  m.querySelector("#ibGo").onclick=async()=>{try{const r=await api("POST","/api/p/board-users",{name:$("#ibN").value,email:$("#ibE").value,role:$("#ibR").value});closeModal();if(r.link)modal(`<h2>Email not sent</h2><p>Send this set-password link yourself:</p><input readonly value="${esc(r.link)}" onclick="this.select()"><div style="text-align:right;margin-top:10px"><button class="btn" onclick="closeModal();route()">Done</button></div>`);else{toast("Invitation sent");route();}}catch(e){fail(e);}};}

/* ---------- Claude connector ---------- */
PAGES.claude=async()=>{
  const r=await api("GET","/api/p/claude");
  main().innerHTML=`<div class="head"><h1>Claude connector</h1></div>
  <div class="card"><p>Connect Claude (claude.ai, the Claude desktop and mobile apps) to the Trustee Portal, then ask things like <i>"What actions do I have?"</i>, <i>"What did we decide about the Christmas hampers?"</i> or <i>"Mark my hampers action as done"</i>.</p>
   ${r.enabled?`<div class="ok">The connector is <b>on</b>.</div>`:`<div class="warn">The connector is <b>off</b>.${PERMS.admin?"":" Ask the Global Admin to switch it on."}</div>`}
   ${PERMS.admin?`<button class="btn ${r.enabled?"sec":""}" onclick="claudeToggle(${!r.enabled})">${r.enabled?"Switch off (disconnects everyone)":"Switch the connector on"}</button>`:""}</div>
  <div class="card"><h2>How to connect</h2><ol>
   <li>In Claude, open <b>Settings → Connectors</b> (claude.ai/customize/connectors) and choose <b>Add custom connector</b>.<br><span class="hint">On a Team or Enterprise plan, an owner adds it once under Organisation settings → Connectors.</span></li>
   <li>Name: <b>D.U.C. Trustee Portal</b>. Remote MCP server URL:<br><input readonly value="${esc(r.url)}" onclick="this.select()" style="max-width:520px"><br><span class="hint">Leave the advanced OAuth settings empty.</span></li>
   <li>Press <b>Connect</b>, sign in with your portal username and password, and press <b>Allow</b>.</li></ol>
   <p class="hint">Claude sees only what your role allows. Names, addresses and other personal details of people referred for help are never sent to Claude – only reference numbers and initials. Claude can't vote, approve minutes or send letters. Everything it does is recorded in the audit log.</p></div>
  ${PERMS.admin?`<div class="card"><h2>Check the connector</h2><p class="hint">Runs the same steps Claude does when you press Connect, and shows any that fail.</p><button class="btn sec" onclick="claudeCheck()">Run the check</button><div id="ccRes"></div>
   ${r.failures&&r.failures.length?`<h3 style="margin-top:14px">Recent failed attempts from Claude</h3><table class="t">${r.failures.map(f=>`<tr><td style="white-space:nowrap">${fmtDT(f.time)}</td><td>${esc(f.details)}</td></tr>`).join("")}</table>`:""}</div>
  <div class="card"><h2>Client ID (if Claude says "Couldn't register")</h2><p>Create a Client ID, then in Claude open the connector's <b>Advanced settings</b>, paste it into <b>OAuth Client ID</b> and leave <b>OAuth Client Secret</b> empty.</p>
   ${r.clients.length?`<table class="t">${r.clients.map(c=>`<tr><td><input readonly value="${esc(c.id)}" onclick="this.select()" style="max-width:340px"></td><td class="hint">created ${fmtD(c.created)}</td><td><button class="btn sm ghost" onclick="claudeDelClient('${c.id}')">Delete</button></td></tr>`).join("")}</table>`:""}
   <button class="btn sec" onclick="claudeNewClient()">Create a Client ID</button></div>`:""}
  <div class="card"><h2>${PERMS.admin?"Everyone's connections":"Your connections"}</h2>${r.connections.length?`<table class="t"><tr><th>Person</th><th>App</th><th>Since</th><th></th></tr>${r.connections.map(c=>`<tr><td>${esc(c.user)}</td><td>${esc(c.app)}</td><td>${fmtD(c.since)}</td><td><button class="btn sm ghost" onclick="claudeOff('${c.userId}','${c.client}')">Disconnect</button></td></tr>`).join("")}</table>`:`<p class="empty">No connections.</p>`}</div>`;
};
async function claudeCheck(){$("#ccRes").innerHTML="<p>Checking…</p>";try{const r=await api("POST","/api/p/claude",{selfCheck:true});const c=r.check;$("#ccRes").innerHTML=`<table class="t" style="margin-top:10px">${c.map(x=>`<tr><td>${x.ok?"✅":"❌"}</td><td><b>${esc(x.step)}</b><br><span class="hint">${esc(x.url)} → ${x.status||"no answer"}</span>${x.ok?"":`<br><code style="font-size:12px">${esc(x.body)}</code>`}</td></tr>`).join("")}</table>${c.every(x=>x.ok)?`<div class="ok" style="margin-top:8px">All good – Claude should be able to connect.</div>`:`<div class="warn" style="margin-top:8px">${claudeAdvice(c)}</div>`}`;}catch(e){$("#ccRes").innerHTML="";fail(e);}}
function claudeAdvice(c){const f=c.find(x=>!x.ok);if(!f)return"";const s=f.status;
  if(s===404&&/switched off/.test(f.body))return"The connector is switched off – press the button at the top of this page.";
  if(s===403||s===406||s===501)return"Your server's firewall (ModSecurity) is blocking this. In cPanel open <b>ModSecurity</b> and switch it <b>Off</b> for trustees.droitwichunitedcharities.org.uk, then run the check again. Or use a Client ID below.";
  if(/Website address/.test(f.step))return"Go to ⚙️ Portal settings and change <b>Website address</b> to "+esc(location.origin)+", then save and run the check again.";
  if(s===0)return"The server couldn't call its own address – check the Website address in Portal settings is https://trustees.droitwichunitedcharities.org.uk.";
  if(s===200&&/<html/i.test(f.body))return"A web page came back instead of data – the latest files may not be in place. Upload and extract the newest zip again.";
  return"Send this result to your developer.";}
async function claudeNewClient(){try{await api("POST","/api/p/claude",{createClient:true});toast("Client ID created");route();}catch(e){fail(e);}}
async function claudeDelClient(id){if(!confirm("Delete this Client ID? Anyone connected with it will be disconnected."))return;try{await api("POST","/api/p/claude",{deleteClient:id});route();}catch(e){fail(e);}}
async function claudeToggle(on){if(!on&&!confirm("Switch off the Claude connector? Everyone will be disconnected."))return;try{await api("POST","/api/p/claude",{enabled:on});route();}catch(e){fail(e);}}
async function claudeOff(uid,cid){try{await api("POST","/api/p/claude",{disconnect:cid,userId:uid});toast("Disconnected");route();}catch(e){fail(e);}}

/* ---------- start ---------- */
async function boot(){
  try{ME=await api("GET","/api/p/me");}catch(e){main().innerHTML=`<div class="card bad">${esc(e.message)}</div>`;return;}
  PERMS=ME.perms;
  $("#portalName").textContent=PERMS.partner?"Referral partner portal":"Trustee Portal";
  $("#who").innerHTML=`${esc(ME.user.name)} · ${esc(ME.user.roleLabel)}${ME.org?" · "+esc(ME.org.name):""}<br><a href="/change-password">Change password</a><a href="/logout">Sign out</a>`;
  if(PERMS.board){try{BOARD=await api("GET","/api/p/board-users");}catch(e){}}
  route();
}
boot();
</script>
</body>
</html>
