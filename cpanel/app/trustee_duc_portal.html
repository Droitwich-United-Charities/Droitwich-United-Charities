<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal – Droitwich United Charities</title>
<link rel="icon" href="/assets/duc-logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14254a;--green:#2f6b3a;--water:#7fa8d6;--mist:#eaf1f6;--meadow:#e8f0e6;--gold:#e9a21f;--cream:#f7f5ef;--ink:#1d2433;--muted:#5b6475;--line:#e2e0d8;--red:#b3261e;--radius:12px}
*{box-sizing:border-box}
body{margin:0;font-family:"Source Sans 3",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Libre Baskerville",Georgia,serif;color:var(--navy);line-height:1.25;margin:0 0 .5em}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
a{color:var(--green)}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:8px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}
.brand img{width:44px;height:44px;object-fit:contain}
.brand b{font-family:"Libre Baskerville",serif;font-size:15px;line-height:1.1;display:block}
.brand small{color:var(--green);font-size:12px;font-weight:600}
.who{margin-left:auto;font-size:14px;color:var(--muted);text-align:right}
.who a{margin-left:8px}
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:22px;padding:20px 18px 60px}
nav.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--navy);text-decoration:none;font-weight:600;font-size:15px}
nav.side a:hover{background:var(--mist)}
nav.side a.on{background:var(--navy);color:#fff}
nav.side .sep{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 12px 4px;font-weight:700}
nav.side .badge{margin-left:auto;background:var(--gold);color:#3b2a00;border-radius:999px;font-size:12px;padding:0 8px}
.btn.menu-btn{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav.side{position:static;display:none}nav.side.open{display:flex}.btn.menu-btn{display:inline-flex}}
.card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 10px rgba(20,37,74,.06);padding:18px 20px;margin-bottom:16px}
.card h2{margin-bottom:10px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{margin:0}.head .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--green);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--mist);color:var(--navy)}.btn.navy{background:var(--navy)}.btn.red{background:var(--red)}.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid #c9d3df}
label.l{display:block;font-weight:600;color:var(--navy);font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cfd3dc;border-radius:9px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--water);border-color:var(--water)}
input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0;vertical-align:-2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.row>.fit{flex:0 0 auto;min-width:0}
.hint{color:var(--muted);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:7px 8px}
table.t td{border-bottom:1px solid #eef0f2;padding:8px;vertical-align:top}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#f6f9fc}
.tw{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;background:var(--mist);color:var(--navy);white-space:nowrap}
.pill.g{background:var(--meadow);color:var(--green)}.pill.r{background:#fbe9e7;color:var(--red)}.pill.y{background:#fdf2dc;color:#7a5200}.pill.n{background:#eceff3;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:10px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi div{background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:0 2px 10px rgba(20,37,74,.06)}
.kpi b{display:block;font-family:"Libre Baskerville",serif;font-size:1.6rem;color:var(--navy)}
.kpi span{color:var(--muted);font-size:13.5px}
.list>div{padding:9px 0;border-bottom:1px solid #eef0f2}.list>div:last-child{border:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:90;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
.toast.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:22px 24px}
.modal.wide{max-width:900px}
.warn{background:#fdf2dc;color:#5c3f00;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.ok{background:var(--meadow);color:var(--green);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.bad{background:#fbe9e7;color:var(--red);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.agenda-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fcfcfb}
.agenda-item.conf{border-left:4px solid var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs a{padding:7px 14px;border-radius:999px;background:#fff;color:var(--navy);text-decoration:none;font-weight:600;font-size:14px;border:1px solid var(--line)}
.tabs a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rec-big{font-family:"Libre Baskerville",serif;font-size:3rem;color:var(--navy);letter-spacing:.02em}
.meter{height:12px;border-radius:6px;background:#e5e9ef;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0}
.banner-rec{background:var(--red);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:#fff;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.review{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.review{grid-template-columns:1fr}}
.tx{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fcfcfb}
.seg{padding:6px 0;border-bottom:1px dashed #e8e8e3;font-size:14.5px}
.seg .tm{color:var(--green);font-weight:700;cursor:pointer;font-size:12.5px;margin-right:6px}
.seg .sp{font-weight:700;color:var(--navy);margin-right:4px}
.msg{border-radius:12px;padding:9px 12px;margin:6px 0;max-width:80%}
.msg.duc{background:var(--mist)}.msg.partner{background:var(--meadow);margin-left:auto}
.msg small{display:block;color:var(--muted);font-size:12px}
.cal-month{margin-bottom:18px}.cal-ev{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #eef0f2}.cal-ev .d{width:110px;flex:0 0 auto;font-weight:700;color:var(--navy)}
.prog{height:8px;background:#e5e9ef;border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--green);width:0}
.legal{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;max-height:340px;overflow:auto;margin:10px 0}
.countdown{font-family:"Libre Baskerville",serif;font-size:1.3rem}
pre.block{white-space:pre-wrap;font-family:inherit;background:#fcfcfb;border:1px solid var(--line);border-radius:10px;padding:12px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0}.chk input{margin-top:4px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="btn sec sm menu-btn" onclick="document.querySelector('nav.side').classList.toggle('open')">☰ Menu</button>
  <a class="brand" href="#dashboard"><img src="/assets/duc-logo.webp" alt=""><span><b>Droitwich United Charities</b><small id="portalName">Portal</small></span></a>
  <div class="who" id="who"></div>
</div></header>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="main"><div class="card">Loading…</div></main>
</div>
<script>
"use strict";
let ME=null, PERMS={}, BOARD=[], CACHE={};
const $=s=>document.querySelector(s), main=()=>document.getElementById("main");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");
const fmtD=s=>{if(!s)return"—";const d=new Date(s.length===10?s+"T12:00":s);return isNaN(d)?s:d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});};
const fmtDT=s=>{if(!s)return"—";const d=new Date(s);return isNaN(d)?s:d.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});};
const hms=t=>{t=Math.max(0,Math.floor(t));return[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(x=>String(x).padStart(2,"0")).join(":");};
const money=v=>v===""||v==null?"—":"£"+Number(v).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
async function api(method,url,body){
  const o={method,headers:{"X-DUC":"1"},credentials:"same-origin"};
  if(body!==undefined){if(body instanceof ArrayBuffer||body instanceof Blob){o.body=body;o.headers["Content-Type"]="application/octet-stream";}else{o.body=JSON.stringify(body);o.headers["Content-Type"]="application/json";}}
  const r=await fetch(url,o);let j=null;try{j=await r.json();}catch(e){}
  if(r.status===401){location.href="/login?next=/portal";throw new Error("Please sign in");}
  if(!r.ok){const e=new Error((j&&j.error)||("Error "+r.status));e.status=r.status;e.data=j;throw e;}
  return j;
}
function toast(m,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),err?6000:3200);}
const fail=e=>toast(e.message||String(e),true);
function modal(html,wide){const bg=document.createElement("div");bg.className="modal-bg";bg.innerHTML=`<div class="modal ${wide?"wide":""}">${html}</div>`;bg.addEventListener("click",e=>{if(e.target===bg)bg.remove();});document.body.appendChild(bg);return bg;}
function closeModal(){document.querySelectorAll(".modal-bg").forEach(m=>m.remove());}
function confirmBox(msg,yes,label="Confirm",danger){const m=modal(`<h2>Please confirm</h2><p>${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn sec fit" onclick="closeModal()">Cancel</button><button class="btn fit ${danger?"red":""}" id="cfYes">${esc(label)}</button></div>`);m.querySelector("#cfYes").onclick=async()=>{closeModal();await yes();};}
function pill(st,label){const map={done:"g",approved:"g",paid:"g",sent:"g",ready:"g",minutes_approved:"g",in_progress:"y",submitted:"y",more_info:"y",with_trustees:"y",published:"y",held:"y",processing:"y",uploaded:"y",draft:"n",not_started:"n",carried:"n",declined:"r",blocked:"r",error:"r",withdrawn:"n",open:"y",closed:"n",pending:"y",suspended:"r",rejected:"r",id_check:"y",queued:"y"};return`<span class="pill ${map[st]||""}">${esc(label||st.replace(/_/g," "))}</span>`;}
const STATUS_ACTION={not_started:"Not started",in_progress:"In progress",done:"Done",blocked:"Blocked",carried:"Carried forward"};
const MEET_STATUS={draft:"Draft",published:"Published",held:"Held",minutes_approved:"Minutes approved"};
const userOpts=(sel,blank="— nobody —")=>`<option value="">${blank}</option>`+BOARD.map(u=>`<option value="${u.id}" ${u.id===sel?"selected":""}>${esc(u.name)}</option>`).join("");
const uname=id=>(BOARD.find(u=>u.id===id)||{}).name||"";

/* ---------- chunked upload (fits small cPanel limits) ---------- */
async function uploadFile(file,onp){
  const CH=1024*1024;let id="";
  for(let seq=0,off=0;off<file.size||seq===0;seq++,off+=CH){
    const part=await file.slice(off,off+CH).arrayBuffer();
    const q=seq===0?`seq=0&name=${encodeURIComponent(file.name)}&type=${encodeURIComponent(file.type||guessType(file.name))}&size=${file.size}`:`seq=${seq}&id=${id}`;
    let tries=0;
    for(;;){try{const r=await api("POST","/api/p/upload?"+q+(seq?"":""),part);id=r.id;break;}catch(e){if(e.status&&e.status<500)throw e;if(++tries>4)throw e;await new Promise(r=>setTimeout(r,1500*tries));}}
    onp&&onp(Math.min(1,(off+CH)/file.size));
    if(off+CH>=file.size)break;
  }
  return id;
}
function guessType(n){n=n.toLowerCase();return n.endsWith(".pdf")?"application/pdf":n.endsWith(".docx")?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":n.endsWith(".doc")?"application/msword":n.endsWith(".xlsx")?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":n.endsWith(".jpg")||n.endsWith(".jpeg")?"image/jpeg":n.endsWith(".png")?"image/png":n.endsWith(".heic")?"image/heic":n.endsWith(".csv")?"text/csv":"text/plain";}
function pickFile(accept,cb){const i=document.createElement("input");i.type="file";i.accept=accept||"";i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click();}

/* ---------- navigation ---------- */
function navItems(){
  const n=[];
  if(PERMS.partner){
    n.push(["referrals","📨","Our referrals"],["new-referral","➕","New referral"]);
    if(ME.user.orgAdmin)n.push(["colleagues","👥","Colleagues"]);
    n.push(["sep","","Help"],["privacy","🔒","Privacy & agreement"]);
    return n;
  }
  n.push(["dashboard","🏠","Dashboard"],["meetings","🗓️","Meetings"],["actions","✅","Actions",CACHE.myOpen],["papers","📁","Board papers"],["decisions","🗳️","Decisions",CACHE.toVote],["calendar","📅","Calendar"],["search","🔎","Search minutes"]);
  if(PERMS.clerk)n.push(["sep","","Case work"],["referrals","📥","Referrals",CACHE.newRefs],["partners","🤝","Partners",CACHE.orgsPending],["letters","✉️","Letters",CACHE.draftLetters]);
  if(PERMS.gdpr)n.push(["sep","","Data protection"],["gdpr","🛡️","GDPR tools",CACHE.sars]);
  n.push(["sep","",PERMS.admin?"Admin":"You"]);
  if(PERMS.admin)n.push(["settings","⚙️","Portal settings"]);
  n.push(["team","👥","Trustees & officers"]);
  n.push(["claude","✳️","Claude connector"]);
  return n;
}
function renderNav(){
  const cur=(location.hash.slice(1)||"").split("/")[0]||(PERMS.partner?"referrals":"dashboard");
  $("#nav").innerHTML=navItems().map(([k,i,l,b])=>k==="sep"?`<div class="sep">${l}</div>`:`<a href="#${k}" class="${cur===k||(cur==="meeting"&&k==="meetings")||(cur==="record"&&k==="meetings")||(cur==="referral"&&k==="referrals")||(cur==="letter"&&k==="letters")?"on":""}">${i} ${l}${b?`<span class="badge">${b}</span>`:""}</a>`).join("")+`<div class="sep">Website</div><a href="/">🌐 Back to website</a>`;
}
async function route(){
  if(REC.active&&!location.hash.startsWith("#record/")){if(!confirm("Recording is still running. Leave this page? The recording will stop.")){history.back();return;}REC.abort();}
  document.querySelector("nav.side").classList.remove("open");
  renderNav();
  const [p,a,b]=(location.hash.slice(1)||"").split("/");
  const page=p||(PERMS.partner?"referrals":"dashboard");
  main().innerHTML=`<div class="card">Loading…</div>`;
  try{
    if(PERMS.partner&&(ME.needs.agreement||ME.needs.privacy))return renderGate();
    const fn=PAGES[page];
    if(!fn){main().innerHTML=`<div class="card"><h1>Not found</h1></div>`;return;}
    await fn(a,b);
  }catch(e){main().innerHTML=`<div class="card bad">${esc(e.message)}</div>`;}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
window.addEventListener("beforeunload",e=>{if(REC.active||REC.queue.length){e.preventDefault();e.returnValue="";}});

/* ---------- dashboard ---------- */
const PAGES={};
PAGES.dashboard=async()=>{
  const d=await api("GET","/api/p/dashboard");
  CACHE.myOpen=d.actions.length||"";CACHE.toVote=d.cases.filter(c=>!c.voted).length||"";
  if(PERMS.clerk){CACHE.newRefs=d.referrals.new||"";CACHE.orgsPending=d.orgsPending||"";CACHE.draftLetters=d.letters||"";}
  if(PERMS.gdpr)CACHE.sars=d.sars||"";
  renderNav();
  const s=ME.setup;let warn="";
  if(PERMS.admin&&s&&(!s.email||!s.gemini||!s.siteUrl||!s.cron))warn=`<div class="warn"><b>Finish setting up:</b> ${[!s.siteUrl&&"website address",!s.email&&"email (SMTP)",!s.gemini&&"AI for meeting notes",!s.cron&&"the cron job"].filter(Boolean).join(", ")}. <a href="#settings">Open Portal settings</a></div>`;
  const n=d.next;
  main().innerHTML=warn+`<div class="head"><h1>Hello, ${esc(ME.user.name.split(" ")[0])}</h1></div>
  ${PERMS.clerk?`<div class="kpi"><div><b>${d.referrals.new}</b><span>new referrals</span></div><div><b>${d.referrals.late}</b><span>referrals over 10 working days</span></div><div><b>${d.review.length}</b><span>meetings to review</span></div><div><b>${d.letters}</b><span>draft letters</span></div><div><b>${d.orgsPending}</b><span>partner applications</span></div></div>`:""}
  <div class="grid g2">
   <div class="card"><h2>Next meeting</h2>${n?`<p style="margin:0"><a href="#meeting/${n.id}"><b>${esc(n.title)}</b></a></p><p class="hint" style="margin:2px 0 10px">${fmtDT(n.date)}${n.venue?" · "+esc(n.venue):""}</p>
     ${n.status!=="draft"?`<div class="row"><button class="btn sm fit ${n.my==="attending"?"":"sec"}" onclick="rsvp('${n.id}','attending')">✓ Attending</button><button class="btn sm fit ${n.my==="apologies"?"navy":"sec"}" onclick="rsvp('${n.id}','apologies')">Apologies</button><a class="btn sm ghost fit" href="/api/p/meetings/${n.id}/invite.ics">Add to calendar</a></div>`:`<p class="hint">Draft – not yet sent to trustees.</p>`}`:`<p class="empty">No meeting booked.</p>`}</div>
   <div class="card"><h2>My actions</h2>${d.actions.length?`<div class="list">${d.actions.slice(0,6).map(a=>`<div><a href="#actions">${esc(a.text)}</a><br><span class="hint">${a.due?(a.overdue?`<b style="color:var(--red)">Overdue – was due ${fmtD(a.due)}</b>`:"Due "+fmtD(a.due)):"No due date"} · ${STATUS_ACTION[a.status]}</span></div>`).join("")}</div>`:`<p class="empty">Nothing outstanding. 🎉</p>`}</div>
   <div class="card"><h2>Waiting for a decision</h2>${d.cases.length?`<div class="list">${d.cases.map(c=>`<div><a href="#decisions">${esc(c.title)}</a> ${c.voted?pill("done","you've voted"):pill("open","your vote needed")}<br><span class="hint">${c.votes} vote(s) so far</span></div>`).join("")}</div>`:`<p class="empty">Nothing waiting.</p>`}</div>
   <div class="card"><h2>Notices</h2>${PERMS.clerk?`<div class="row" style="margin-bottom:8px"><input id="newsT" placeholder="Post a short notice to trustees"><button class="btn sm fit" onclick="postNews()">Post</button></div>`:""}
     ${d.news.length?`<div class="list">${d.news.map(x=>`<div>${nl(x.text)}<br><span class="hint">${esc(x.by)} · ${fmtD(x.at)}</span>${PERMS.clerk?` <a href="javascript:delNews('${x.id}')" class="hint">remove</a>`:""}</div>`).join("")}</div>`:`<p class="empty">No notices.</p>`}</div>
   ${d.confirm.length?`<div class="card"><h2>Please read and confirm</h2><div class="list">${d.confirm.map(x=>`<div><a href="#papers">${esc(x.title)}</a></div>`).join("")}</div></div>`:""}
   ${PERMS.clerk&&d.review.length?`<div class="card"><h2>Meeting notes to review</h2><div class="list">${d.review.map(m=>`<div><a href="#meeting/${m.id}">${esc(m.title)}</a> <span class="hint">${fmtD(m.date)}</span></div>`).join("")}</div></div>`:""}

function renderRecBox(){

async function processNow(){confirmBox(MT.recording.status==="ready"?"Run Gemini again? Your edits to the drafts will be replaced.":"Send the recording to Gemini now?",async()=>{try{await api("POST",`/api/p/meetings/${MT.id}/process`);toast("Started – this page will update. Saltway AI jobs run in the background within 15 minutes.");setTimeout(route,1500);}catch(e){fail(e);}},"Go");}
function uploadRecording(){
  pickFile("audio/*,video/mp4,.m4a,.mp3,.wav",async f=>{
    const types={"mp3":"audio/mpeg","wav":"audio/wav","m4a":"audio/mp4","ogg":"audio/ogg","flac":"audio/flac","aac":"audio/aac","mp4":"video/mp4"};
    const ext=f.name.split(".").pop().toLowerCase();const mime=types[ext]||f.type;
    if(!Object.values(types).includes(mime)){toast("Use an MP3, WAV, M4A, OGG, FLAC or MP4 file",true);return;}
    let duration=0;try{duration=await new Promise(res=>{const a=document.createElement("audio");a.preload="metadata";a.onloadedmetadata=()=>res(a.duration||0);a.onerror=()=>res(0);a.src=URL.createObjectURL(f);});}catch(e){}
    const mm=modal(`<h2>Uploading ${esc(f.name)}</h2><p class="hint">${kb(f.size)}. Please keep this page open.</p><div class="prog"><i id="upP"></i></div>`);
    try{
      await api("POST",`/api/p/meetings/${MT.id}/rec/start`,{method:"upload",mime,size:f.size,name:f.name});
      const CH=2*1024*1024;
      for(let seq=0,off=0;off<f.size;seq++,off+=CH){const part=await f.slice(off,off+CH).arrayBuffer();let t=0;for(;;){try{await api("POST",`/api/p/meetings/${MT.id}/rec/chunk?seq=${seq}`,part);break;}catch(e){if(e.status===409&&e.data&&e.data.next>seq)break;if(++t>5)throw e;await new Promise(r=>setTimeout(r,2000*t));}}$("#upP").style.width=Math.min(100,(off+CH)/f.size*100)+"%";}
      const r=await api("POST",`/api/p/meetings/${MT.id}/rec/finish`,{duration:Math.round(duration)});
      closeModal();toast(r.processing?"Uploaded – Gemini is transcribing it now":(r.message||"Uploaded"));route();
    }catch(e){closeModal();fail(e);}
  });
}

async function startRec(id){
  if(!["c1","c2","c3"].every(k=>$("#"+k).checked)){toast("Please tick all three boxes first",true);return;}
  try{
    REC.stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:$("#micSel").value||undefined,echoCancellation:false,noiseSuppression:true,autoGainControl:true,channelCount:1}});
    await api("POST",`/api/p/meetings/${id}/rec/start`,{method:"room",consent:true,sampleRate:16000});
  }catch(e){fail(e);return;}
  Object.assign(REC,{active:true,paused:false,queue:[],seq:0,samples:0,chunks:[],pending:[],mid:id,pos:0,item:null,started:Date.now()});
  const ctx=REC.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(REC.stream);
  const node=REC.node=ctx.createScriptProcessor(4096,1,1);
  const ratio=ctx.sampleRate/16000;
  node.onaudioprocess=e=>{
    const inp=e.inputBuffer.getChannelData(0);let peak=0;for(let i=0;i<inp.length;i+=16)peak=Math.max(peak,Math.abs(inp[i]));REC.lastLevel=peak;
    if(REC.paused)return;
    const out=[];let p=REC.pos;
    while(p<inp.length){const i=Math.floor(p),f=p-i,a=inp[i],b=i+1<inp.length?inp[i+1]:a;let v=a+(b-a)*f;v=Math.max(-1,Math.min(1,v));out.push(v<0?v*0x8000:v*0x7fff);p+=ratio;}
    REC.pos=p-inp.length;
    const pcm=Int16Array.from(out);REC.pending.push(pcm);REC.chunks.push(pcm);REC.samples+=pcm.length;
  };
  src.connect(node);node.connect(ctx.destination);
  try{REC.wake=await navigator.wakeLock.request("screen");}catch(e){}
  REC.timer=setInterval(()=>{flushPending();drawStatus();},5000);
  setInterval(()=>{if(REC.active)drawLevel();},200);
  drawRecorder();
}
function flushPending(){if(!REC.pending.length)return;const n=REC.pending.reduce((a,b)=>a+b.length,0);const buf=new Int16Array(n);let o=0;for(const c of REC.pending){buf.set(c,o);o+=c.length;}REC.pending=[];REC.queue.push({seq:REC.seq++,data:buf.buffer});sendQueue();}
async function sendQueue(){
  if(REC.sending)return;REC.sending=true;
  while(REC.queue.length){
    const q=REC.queue[0];
    try{await api("POST",`/api/p/meetings/${REC.mid}/rec/chunk?seq=${q.seq}`,q.data);REC.queue.shift();REC.offline=false;}
    catch(e){if(e.status===409&&e.data&&typeof e.data.next==="number"){REC.queue=REC.queue.filter(x=>x.seq>=e.data.next);if(REC.queue.length&&REC.queue[0].seq>e.data.next){REC.offline=true;break;}continue;}REC.offline=true;await new Promise(r=>setTimeout(r,4000));if(!REC.active&&REC.queue.length&&REC.giveUp)break;}
    drawStatus();
  }
  REC.sending=false;drawStatus();
}
const recT=()=>REC.samples/16000;
async function marker(type,itemId){try{await api("POST",`/api/p/meetings/${REC.mid}/rec/marker`,{t:Math.round(recT()),itemId:itemId||"",type});}catch(e){}}
function drawRecorder(){

   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn navy fit" id="pBtn" onclick="togglePause()">⏸ Pause</button><button class="btn red fit" onclick="stopRec()">⏹ Stop and save</button></div>
   <p class="hint" style="margin-top:12px">Keep this tab open and the laptop plugged in.</p><button class="btn sm ghost" onclick="downloadBackup()">⬇ Download a backup copy</button></div>
  <div class="card"><h2>Now discussing</h2><p class="hint">Tap the item being discussed. It helps the notes line up with the agenda. Confidential items pause the recording automatically.</p>
   <div id="recAg">${m.agenda.map(a=>`<button class="btn sec" style="display:flex;width:100%;margin-bottom:6px;justify-content:flex-start;white-space:normal;text-align:left" data-id="${a.id}" onclick="nowItem('${a.id}')">${a.confidential?"🔒 ":""}${esc(a.title)}</button>`).join("")}</div></div></div>`;

function drawLevel(){const l=$("#lvl");if(l)l.style.width=Math.min(100,REC.lastLevel*140)+"%";const t=$("#recTime");if(t)t.textContent=hms(recT());}
function drawStatus(){const s=$("#recSt");if(!s)return;const q=REC.queue.length;s.innerHTML=(REC.paused?"<b>Paused</b> · ":"")+(REC.offline?`<b style="color:var(--red)">Connection lost – keeping ${q} part(s) safe and retrying…</b>`:q?`Uploading… ${q} part(s) waiting`:"✓ All audio safely uploaded");const b=$("#recBan");if(b){b.style.background=REC.paused?"#7a5200":"";b.innerHTML=`<span class="dot"></span> ${REC.paused?"PAUSED":"RECORDING"} – ${esc(MT.title)}`;}const pb=$("#pBtn");if(pb)pb.textContent=REC.paused?"▶ Resume":"⏸ Pause";
  document.querySelectorAll("#recAg button").forEach(b=>{b.className="btn "+(b.dataset.id===REC.item?"":"sec");});}

async function stopRec(){
  confirmBox("Stop the recording and save it?",async()=>{

    clearInterval(REC.timer);REC.active=false;flushPending();
    const mm=modal(`<h2>Saving the recording…</h2><p id="svSt" class="hint">Uploading the last parts.</p><button class="btn sm ghost" onclick="downloadBackup()">⬇ Download a backup copy</button>`);

    if(REC.queue.length){$("#svSt").innerHTML="<b>Couldn't upload everything.</b> Download a backup copy now, then upload it from the meeting page when you're back online.";return;}
    try{const r=await api("POST",`/api/p/meetings/${REC.mid}/rec/finish`,{sampleRate:16000});closeModal();toast(r.processing?"Saved – Gemini is writing the notes now":(r.message||"Saved"));REC.chunks=[];location.hash="meeting/"+REC.mid;}

function downloadBackup(){
  const n=REC.chunks.reduce((a,b)=>a+b.length,0);if(!n){toast("Nothing recorded yet");return;}
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  let o=44;for(const c of REC.chunks){new Int16Array(buf,o,c.length).set(c);o+=c.length*2;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));a.download="DUC meeting backup "+new Date().toISOString().slice(0,16).replace(":","-")+".wav";a.click();
}

     <h3 style="margin-top:12px">Votes so far</h3><p style="margin:0">✓ ${c.tally.approve} approve · ✕ ${c.tally.decline} decline · ? ${c.tally.more_info} more info · – ${c.tally.abstain} abstain</p>
     ${c.voters.length?`<div class="list">${c.voters.map(v=>`<div><b>${esc(v.name)}</b> – ${esc(v.vote.replace("_"," "))}${v.comment?`<br><span class="hint">${esc(v.comment)}</span>`:""}</div>`).join("")}</div>`:""}

  ${closed.length?`<div class="card tw"><h2>Decided</h2><table class="t"><tr><th>Request</th><th>Outcome</th><th>Votes</th><th>Closed</th></tr>${closed.map(c=>`<tr><td>${esc(c.title)}</td><td>${pill(c.status,c.status.replace("_"," "))}</td><td>${c.tally.approve}/${c.tally.decline}/${c.tally.more_info}/${c.tally.abstain}</td><td>${fmtD(c.closedAt)}</td></tr>`).join("")}</table></div>`:""}`;
};
const CATEGORIES_LABEL={household:"Household items or furniture",utilities:"Gas, electricity or water",food:"Food",clothing:"Clothing or school uniform",education:"Education or training",health:"Health, mobility or disability equipment",travel:"Travel or transport",other:"Something else"};
async function vote(id,v){if(!$("#nc_"+id).checked){toast("Please confirm you have no conflict of interest first",true);return;}try{await api("POST",`/api/p/cases/${id}/vote`,{vote:v,noConflict:true,comment:$("#vc_"+id).value});toast("Vote recorded");route();}catch(e){fail(e);}}
function declConf(id){const m=modal(`<h2>Declare a conflict of interest</h2><p>You won't be able to vote on this request. The conflict is recorded in the minutes.</p><label class="l">What is the conflict?</label><input id="dcR" placeholder="e.g. I know the family personally"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec fit" onclick="closeModal()">Cancel</button><button class="btn fit" id="dcGo">Declare</button></div>`);m.querySelector("#dcGo").onclick=async()=>{try{await api("POST",`/api/p/cases/${id}/vote`,{conflict:true,reason:$("#dcR").value});closeModal();route();}catch(e){fail(e);}};}
function closeCase(c){const m=modal(`<h2>Record the trustees' decision</h2><label class="l">Outcome</label><select id="ccO"><option value="approved" ${c.suggested==="approved"?"selected":""}>Approved – grant awarded</option><option value="declined" ${c.suggested==="declined"?"selected":""}>Declined</option><option value="more_info" ${c.suggested==="more_info"?"selected":""}>More information needed</option></select>
  <div id="ccA"><div class="row"><div><label class="l">Amount (£)</label><input id="ccAm" value="${esc(c.amount)}"></div><div><label class="l">Paid by</label><input id="ccP" placeholder="e.g. direct payment to the supplier"></div></div><label class="l">What it's for (goes in the letter)</label><input id="ccPu" placeholder="e.g. a new bed and bedding"></div>
  <div id="ccD" style="display:none"><label class="l">Reason (goes in the letter – kind and brief)</label><textarea id="ccR"></textarea></div><div id="ccM" style="display:none"><label class="l">Information needed</label><textarea id="ccI"></textarea></div>
  <p class="hint">A draft letter is created for you to check in Letters. The referrer is told the status, without personal details.</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec fit" onclick="closeModal()">Cancel</button><button class="btn fit" id="ccGo">Record decision</button></div>`);
  const sw=()=>{const o=$("#ccO").value;$("#ccA").style.display=o==="approved"?"":"none";$("#ccD").style.display=o==="declined"?"":"none";$("#ccM").style.display=o==="more_info"?"":"none";};$("#ccO").onchange=sw;sw();
  m.querySelector("#ccGo").onclick=async()=>{try{const r=await api("POST",`/api/p/cases/${c.id}/close`,{outcome:$("#ccO").value,amount:$("#ccAm").value,payment:$("#ccP").value,purpose:$("#ccPu").value,reason:$("#ccR").value,info:$("#ccI").value});closeModal();toast("Decision recorded – draft letter ready");if(r.letterId)location.hash="letter/"+r.letterId;else route();}catch(e){fail(e);}};}

/* ---------- calendar & search ---------- */
PAGES.calendar=async()=>{
  const r=await api("GET","/api/p/calendar");const by={};
  r.events.filter(e=>e.start>=new Date(Date.now()-31*864e5).toISOString().slice(0,10)).forEach(e=>{const k=e.start.slice(0,7);(by[k]=by[k]||[]).push(e);});
  const icon={meeting:"🗓️",action:"✅",review:"📄",vote:"🗳️"},link=e=>e.kind==="meeting"?"#meeting/"+e.id:e.kind==="action"?"#actions":e.kind==="vote"?"#decisions":"#papers";
  main().innerHTML=`<div class="head"><h1>Calendar</h1><span class="sp"></span><button class="btn sec fit" onclick="calLink()">${r.feed?"New private link":"Add to Outlook / phone"}</button></div>${r.feed?`<div class="ok">Your private calendar link (subscribe in Outlook or on your phone – don't share it): <br><input readonly value="${esc(r.feed)}" onclick="this.select()"></div>`:""}
  <div class="card">${Object.keys(by).length?Object.entries(by).map(([k,l])=>`<div class="cal-month"><h2>${new Date(k+"-01T12:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</h2>${l.map(e=>`<div class="cal-ev"><span class="d">${new Date(e.start).toLocaleDateString("en-GB",{weekday:"short",day:"numeric"})}${e.allDay?"":"<br><span class='hint'>"+new Date(e.start).toLocaleTimeString("en-GB",{hour:"numeric",minute:"2-digit"})+"</span>"}</span><span>${icon[e.kind]} <a href="${link(e)}">${esc(e.title)}</a>${e.where?`<br><span class="hint">${esc(e.where)}</span>`:""}</span></div>`).join("")}</div>`).join(""):`<p class="empty">Nothing coming up.</p>`}</div>`;
};
async function calLink(){try{const r=await api("POST","/api/p/calendar");toast("Link created");route();}catch(e){fail(e);}}
PAGES.search=async()=>{
  main().innerHTML=`<div class="head"><h1>Search minutes</h1></div><div class="card"><div class="row"><input id="sq" placeholder="e.g. Christmas hampers" onkeydown="if(event.key==='Enter')doSearch()"><button class="btn fit" onclick="doSearch()">Search</button><button class="btn sec fit" onclick="doAsk()">✨ Ask Gemini</button></div><p class="hint">Search looks for the exact words. "Ask Gemini" answers a question from the approved minutes, for example "What did we decide about the Christmas hampers?"</p></div><div id="sr"></div>`;
};
async function doSearch(){const q=$("#sq").value.trim();if(!q)return;try{const r=await api("GET","/api/p/search?q="+encodeURIComponent(q));$("#sr").innerHTML=`<div class="card">${r.length?`<div class="list">${r.map(x=>`<div><a href="#meeting/${x.meetingId}"><b>${esc(x.meeting)}</b></a> <span class="pill">${esc(x.where)}</span><br>${esc(x.text)}</div>`).join("")}</div>`:`<p class="empty">No matches.</p>`}</div>`;}catch(e){fail(e);}}
async function doAsk(){const q=$("#sq").value.trim();if(!q)return;$("#sr").innerHTML=`<div class="card">Thinking…</div>`;try{const r=await api("POST","/api/p/ask",{q});$("#sr").innerHTML=`<div class="card"><h2>Answer</h2><pre class="block">${esc(r.answer)}</pre><p class="hint">Written by Gemini from the approved minutes. Check the minutes before relying on it.</p></div>`;}catch(e){$("#sr").innerHTML="";fail(e);}}

  const r=await api("GET","/api/p/referrals");REFMETA=r;

    <div class="kpi"><div><b>${s.made}</b><span>referrals this year</span></div><div><b>${s.approved}</b><span>approved</span></div><div><b>${money(s.total)}</b><span>awarded this year</span></div></div>

function refTable(list,inbox){return list.length?`<table class="t"><tr><th>Reference</th><th>Person</th>${inbox?"<th>Partner</th>":""}<th>Help</th><th>Amount</th><th>Status</th><th>Updated</th></tr>${list.map(x=>`<tr class="click" onclick="location.hash='referral/${x.id}'"><td><b>${esc(x.ref||"Draft")}</b>${x.unread?` <span class="pill y">${x.unread} new</span>`:""}</td><td>${esc(x.name||"—")}${inbox&&x.postcode?`<br><span class="hint">${esc(x.postcode)}${x.inArea?"":" ⚠ outside area?"}</span>`:""}</td>${inbox?`<td>${esc(x.org)}</td>`:""}<td>${esc(x.categoryLabel)}</td><td>${money(x.amount)}</td><td>${pill(x.status,x.statusLabel)}${x.late?` <span class="pill r">late</span>`:""}${x.dup?` <span class="pill y">possible duplicate</span>`:""}</td><td>${fmtD(x.updated)}</td></tr>`).join("")}</table>`:`<p class="empty">No referrals here.</p>`;}
PAGES["new-referral"]=async()=>{try{const r=await api("POST","/api/p/referrals",{});location.replace("#referral/"+r.id);}catch(e){fail(e);}};
let RF=null;

   ${partner&&edit?`<button class="btn sec fit" onclick="saveRef()">Save draft</button><button class="btn fit" onclick="submitRef()">${r.status==="more_info"?"Send updated referral":"Submit referral"}</button>`:""}
   ${partner&&r.status==="draft"?`<button class="btn ghost fit" onclick="delRef()">Delete draft</button>`:""}
   ${!partner&&PERMS.clerk?`<button class="btn sec fit" onclick="saveRef()">Save changes</button><button class="btn fit" onclick="refStatus()">Change status</button>${["submitted","more_info"].includes(r.status)?`<button class="btn navy fit" onclick="toTrustees()">Put to trustees</button>`:""}`:""}</div>`;
  if(r.status==="more_info"&&partner)h+=`<div class="warn"><b>The Clerk needs more information.</b> See the messages below, update the referral, then press Send updated referral.</div>`;

  h+=`<div class="grid g2"><div>
   <div class="card"><h2>About the person</h2>${fld("name","Full name")}<div class="row"><div>${fld("dob","Date of birth (if relevant)","date")}</div><div>${fld("phone","Phone")}</div></div>${fld("email","Email","email")}${fld("address1","Address line 1")}${fld("address2","Address line 2")}<div class="row"><div>${fld("town","Town","","Droitwich Spa")}</div><div>${fld("postcode","Postcode")}</div></div>
    ${p.postcode&&!r.inArea?`<div class="warn" style="margin-top:8px">This postcode may be outside Droitwich Spa. D.U.C. can only help people living within the town.</div>`:""}
    ${fld("household","Household (who lives with them, ages of children)","ta")}
    <label class="l">How should D.U.C. contact them about the outcome?</label><select data-k="contactPref" ${edit?"":"disabled"}>${[["none","Through us (the referrer) only"],["post","By post"],["email","By email"]].map(([k,t])=>`<option value="${k}" ${(p.contactPref||"none")===k?"selected":""}>${t}</option>`).join("")}</select></div>
   <div class="card"><h2>What help is needed</h2><label class="l">Type of help</label><select id="rfCat" ${edit?"":"disabled"}>${Object.entries(REFMETA.categories||CATEGORIES_LABEL).map(([k,v])=>`<option value="${k}" ${r.category===k?"selected":""}>${esc(v)}</option>`).join("")}</select>
    <label class="l">Amount (£, if known)</label><input id="rfAmt" ${edit?"":"disabled"} value="${esc(r.amount)}" inputmode="decimal">

   <div class="card"><h2>Supporting documents</h2><p class="hint">Quotes, letters or benefit statements. PDF, photos, Word or Excel, up to 10 MB each.</p><div class="list">${r.files.map(f=>`<div><a href="/api/p/referrals/${r.id}/files/${f.id}" target="_blank">📄 ${esc(f.name)}</a> <span class="hint">${kb(f.size)}</span>${edit?` <a href="javascript:delFile('${f.id}')" class="hint">remove</a>`:""}</div>`).join("")||`<div class="empty">None yet.</div>`}</div>${edit?`<button class="btn sm sec" onclick="addFile()">⬆ Add a document</button><div class="prog" style="display:none" id="fP"><i></i></div>`:""}</div>

  </div></div>`;

async function loadRefLetters(id){try{const l=await api("GET",`/api/p/letters?refType=referral&refId=${id}`);$("#rfLetters").innerHTML=l.length?`<div class="list">${l.map(x=>`<div><a href="#letter/${x.id}">${esc(x.templateName)}</a> ${pill(x.status)}<br><span class="hint">${fmtD(x.at)}${x.sentVia?" · "+esc(x.sentVia):""}</span></div>`).join("")}</div>`:`<p class="empty">No letters yet.</p>`;}catch(e){}}
function refBody(){const b={};document.querySelectorAll("[data-k]").forEach(i=>b[i.dataset.k]=i.value);b.category=$("#rfCat").value;b.amount=$("#rfAmt").value;
  if($("#cnG"))b.consent={given:$("#cnG").checked,method:$("#cnM").value,date:$("#cnD").value,health:$("#cnH").checked,noticeGiven:$("#cnN").value};return b;}
async function saveRef(silent){try{RF=await api("PUT","/api/p/referrals/"+RF.id,refBody());if(!silent){toast("Saved");route();}}catch(e){fail(e);throw e;}}
async function submitRef(){try{await saveRef(true);confirmBox("Send this referral to the D.U.C. Clerk? You won't be able to change it unless the Clerk asks for more information.",async()=>{try{const r=await api("POST",`/api/p/referrals/${RF.id}/submit`);toast("Sent – reference "+r.ref);route();}catch(e){fail(e);}},"Send");}catch(e){}}
function delRef(){confirmBox("Delete this draft?",async()=>{try{await api("DELETE","/api/p/referrals/"+RF.id);location.hash="referrals";}catch(e){fail(e);}},"Delete",true);}
function addFile(){pickFile(".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.xls,.xlsx,.txt",async f=>{if(f.size>10*1048576){toast("Files must be under 10 MB",true);return;}const p=$("#fP");p.style.display="";try{await saveRef(true).catch(()=>{});const up=await uploadFile(f,x=>p.firstChild.style.width=x*100+"%");await api("POST",`/api/p/referrals/${RF.id}/files`,{uploadId:up});toast("Added");route();}catch(e){fail(e);p.style.display="none";}});}
function delFile(fid){confirmBox("Remove this document?",async()=>{try{await api("DELETE",`/api/p/referrals/${RF.id}/files/${fid}`);route();}catch(e){fail(e);}},"Remove",true);}
async function sendMsg(){const t=$("#msgT").value.trim();if(!t)return;try{await api("POST",`/api/p/referrals/${RF.id}/messages`,{text:t});toast("Sent");route();}catch(e){fail(e);}}

PAGES.privacy=async()=>{main().innerHTML=`<div class="card"><h1>Privacy & agreement</h1><p><a href="/privacy-notice" target="_blank">Read the D.U.C. privacy notice</a> – you can print it or send the link to people you refer.</p><p>Your organisation accepted version ${ME.org.agreement?ME.org.agreement.version:"?"} of the data sharing agreement${ME.org.agreement?" on "+fmtD(ME.org.agreement.at)+" ("+esc(ME.org.agreement.name)+")":""}.</p><p>Questions? Contact the Clerk, Mrs Janet Clarke, on 01905 775226.</p></div>`;};
function md(t){return t.split(/\n\s*\n/).map(b=>/^#{1,3}\s/.test(b)?`<h3>${esc(b.replace(/^#+\s*/,""))}</h3>`:b.split("\n").every(l=>/^\s*-\s/.test(l))?`<ul>${b.split("\n").map(l=>`<li>${esc(l.replace(/^\s*-\s*/,""))}</li>`).join("")}</ul>`:`<p>${nl(b)}</p>`).join("");}

/* ---------- letters ---------- */
let TPLS=null;
PAGES.letters=async(tab)=>{
  TPLS=TPLS||await api("GET","/api/p/letter-templates");
  const t=tab||"list";
  const tabs=`<div class="tabs"><a href="#letters" class="${t==="list"?"on":""}">Letters</a><a href="#letters/templates" class="${t==="templates"?"on":""}">Templates</a></div>`;
  if(t==="templates"){
    const groups={};Object.entries(TPLS).forEach(([k,v])=>(groups[v.group]=groups[v.group]||[]).push([k,v]));
    main().innerHTML=`<div class="head"><h1>Letter templates</h1></div>${tabs}<p class="hint">Every letter uses the D.U.C. letterhead (logo, charity number and the Clerk's address). Words in {curly brackets} are filled in automatically. ${PERMS.admin?"":"Only the Global Admin can change the wording."}</p>
    ${Object.entries(groups).map(([g,l])=>`<div class="card"><h2>${esc(g)}</h2><div class="list">${l.map(([k,v])=>`<div><b>${esc(v.name)}</b> <span class="hint">· ${esc(v.channel)} · signed by ${esc(v.sign)}${v.updated?" · edited "+fmtD(v.updated):""}</span>${PERMS.admin?` <a href="javascript:editTpl('${k}')">Edit</a>`:` <a href="javascript:viewTpl('${k}')">View</a>`}</div>`).join("")}</div></div>`).join("")}`;
    return;
  }

  main().innerHTML=`<div class="head"><h1>Letters</h1><span class="sp"></span><button class="btn fit" onclick="newLetterFor('','')">+ New letter</button></div>${tabs}
  <div class="card tw">${l.length?`<table class="t"><tr><th>Letter</th><th>To</th><th>About</th><th>Status</th><th>Date</th></tr>${l.map(x=>`<tr class="click" onclick="location.hash='letter/${x.id}'"><td><b>${esc(x.templateName)}</b><br><span class="hint">${esc(x.subject)}</span></td><td>${esc(x.recipient||"—")}</td><td>${esc(x.refLabel||"—")}</td><td>${pill(x.status)}${x.missing&&x.missing.length&&x.status==="draft"?` <span class="pill r">${x.missing.length} gap(s)</span>`:""}</td><td>${fmtD(x.sentAt||x.at)}</td></tr>`).join("")}</table>`:`<p class="empty">No letters yet.</p>`}</div>`;
};
function viewTpl(k){const t=TPLS[k];modal(`<h2>${esc(t.name)}</h2><p><b>${esc(t.subject)}</b></p><pre class="block">${esc(t.body)}</pre><div style="text-align:right"><button class="btn sec" onclick="closeModal()">Close</button></div>`,true);}
function editTpl(k){const t=TPLS[k];const m=modal(`<h2>${esc(t.name)}</h2><label class="l">Subject line</label><input id="etS" value="${esc(t.subject)}"><label class="l">Wording</label><textarea id="etB" style="min-height:300px">${esc(t.body)}</textarea><p class="hint">Blank line = new paragraph. Start lines with "- " for a list. **bold**. Fields: {recipient_name} {reference} {grant_amount} {grant_purpose} {payment_method} {decline_reason} {info_requested} {respond_by} {meeting_title} {meeting_date} {portal_link} {privacy_link} {sar_received} {sar_due} and more.</p>
  <label class="l">Signed by</label><select id="etG">${["chairman","clerk","system"].map(s=>`<option value="${s}" ${t.sign===s?"selected":""}>${{chairman:"Chairman",clerk:"Clerk",system:"Droitwich United Charities (automatic emails)"}[s]}</option>`).join("")}</select>
  <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn sec fit" id="etR">Reset to original</button><span class="fit"><button class="btn sec" onclick="closeModal()">Cancel</button> <button class="btn" id="etGo">Save</button></span></div>`,true);
  m.querySelector("#etGo").onclick=async()=>{try{await api("PUT","/api/p/letter-templates/"+k,{subject:$("#etS").value,body:$("#etB").value,sign:$("#etG").value});TPLS=null;closeModal();toast("Saved");route();}catch(e){fail(e);}};
  m.querySelector("#etR").onclick=()=>confirmBox("Go back to the original wording?",async()=>{try{await api("PUT","/api/p/letter-templates/"+k,{reset:true});TPLS=null;route();}catch(e){fail(e);}},"Reset");}
async function newLetterFor(refType,refId){
  TPLS=TPLS||await api("GET","/api/p/letter-templates");
  const letterT=Object.entries(TPLS).filter(([,v])=>v.channel!=="email");
  const m=modal(`<h2>New letter</h2><label class="l">Letter</label><select id="nlT">${letterT.map(([k,v])=>`<option value="${k}">${esc(v.group)} – ${esc(v.name)}</option>`).join("")}</select>${refType?`<p class="hint">Details are filled in from ${esc(refType)} automatically.</p>`:`<label class="l">About a referral? (reference, optional)</label><input id="nlR" placeholder="DUC-R-2026-0001">`}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec fit" onclick="closeModal()">Cancel</button><button class="btn fit" id="nlGo">Create draft</button></div>`);
  m.querySelector("#nlGo").onclick=async()=>{try{let rt=refType,ri=refId;if(!rt&&$("#nlR").value.trim()){const all=await api("GET","/api/p/referrals");const f=all.referrals.find(x=>x.ref.toLowerCase()===$("#nlR").value.trim().toLowerCase());if(!f)throw new Error("No referral with that reference");rt="referral";ri=f.id;}
    const r=await api("POST","/api/p/letters",{template:$("#nlT").value,refType:rt,refId:ri});closeModal();location.hash="letter/"+r.id;}catch(e){fail(e);}};
}
let LT=null;
PAGES.letter=async(id)=>{
  const l=await api("GET","/api/p/letters");LT=l.find(x=>x.id===id);if(!LT)throw new Error("Letter not found");
  TPLS=TPLS||await api("GET","/api/p/letter-templates");
  const t=TPLS[LT.template],draft=LT.status==="draft";
  const keys=[...new Set(((LT.customSubject??t.subject)+" "+(LT.customBody??t.body)).match(/\{[a-z0-9_]+\}/g)||[])].map(s=>s.slice(1,-1)).filter(k=>!["date","portal_link","privacy_link","signatory_name","signatory_role","signatory_contact"].includes(k));
  const addr=["recipient_name","organisation","address_1","town_postcode","salutation","enclosures"];
  const F=LT.fields||{};
  const fi=(k)=>`<label class="l">${esc(k.replace(/_/g," "))}</label>${["address_1","decline_reason","info_requested","body","kept_reason","breach_summary","breach_actions","breach_advice","breach_data"].includes(k)?`<textarea data-f="${k}" ${draft?"":"disabled"} style="min-height:60px">${esc(F[k]||"")}</textarea>`:`<input data-f="${k}" ${draft?"":"disabled"} value="${esc(F[k]||"")}">`}`;
  main().innerHTML=`<div class="head"><div><a href="#letters" class="hint">← Letters</a><h1>${esc(LT.templateName)}</h1><span class="hint">${LT.refLabel?esc(LT.refLabel)+" · ":""}${pill(LT.status)} ${LT.sentAt?"· "+esc(LT.sentVia)+" "+fmtDT(LT.sentAt)+(LT.sentTo?" to "+esc(LT.sentTo):""):""}</span></div><span class="sp"></span>
   ${draft?`<button class="btn sec fit" onclick="saveLetter()">Save</button>`:""}<a class="btn ghost fit" href="/api/p/letters/${LT.id}">⬇ Word</a>${draft?`<button class="btn fit" onclick="emailLetter()">✉ Email</button><button class="btn sec fit" onclick="postedLetter()">Mark as posted</button><button class="btn ghost fit" onclick="delLetter()">Delete</button>`:""}</div>
  ${LT.missing&&LT.missing.length&&draft?`<div class="warn">Fill in before sending: <b>${LT.missing.map(esc).join(", ")}</b></div>`:""}
  <div class="grid g2"><div class="card"><h2>Recipient</h2>${addr.map(fi).join("")}<h2 style="margin-top:14px">Details</h2>${keys.filter(k=>!addr.includes(k)).map(fi).join("")||`<p class="hint">No other details needed.</p>`}
   <label class="l">Signed by</label><select id="ltG" ${draft?"":"disabled"}>${["chairman","clerk"].map(s=>`<option value="${s}" ${LT.sign===s?"selected":""}>${s==="chairman"?"Chairman":"Clerk"}</option>`).join("")}</select>
   <details style="margin-top:12px"><summary class="hint">Change the wording for this letter only</summary><label class="l">Subject</label><input id="ltS" ${draft?"":"disabled"} value="${esc(LT.customSubject??t.subject)}"><label class="l">Wording</label><textarea id="ltB" ${draft?"":"disabled"} style="min-height:220px">${esc(LT.customBody??t.body)}</textarea></details></div>
  <div class="card"><h2>Preview</h2><div id="ltPrev" style="border:1px solid var(--line);border-radius:8px;padding:18px 22px;font-family:Arial,sans-serif;font-size:14.5px;color:#0B1C3D"></div><p class="hint">The Word file has the full D.U.C. letterhead and footer.</p></div></div>`;
  document.querySelectorAll("[data-f],#ltS,#ltB,#ltG").forEach(i=>i.addEventListener("input",()=>{clearTimeout(window._pv);window._pv=setTimeout(previewLetter,400);}));
  previewLetter();
};
function letterBody(){const f={};document.querySelectorAll("[data-f]").forEach(i=>f[i.dataset.f]=i.value);const t=TPLS[LT.template];const b={fields:f,sign:$("#ltG").value};const s=$("#ltS").value,bd=$("#ltB").value;b.subject=s===t.subject?null:s;b.body=bd===t.body?null:bd;return b;}
async function previewLetter(){try{const b=letterBody();const r=await api("POST","/api/p/letters",{template:LT.template,refType:LT.refType,refId:LT.refId,preview:true,fields:b.fields,subject:b.subject??undefined,body:b.body??undefined,sign:b.sign});const f=r.fields;
  $("#ltPrev").innerHTML=`<div style="text-align:right"><img src="/assets/duc-logo.webp" style="width:80px"></div>${[f.recipient_name,f.organisation,f.address_1,f.town_postcode].filter(Boolean).map(nl).join("<br>")}<p>${esc(f.date)}</p><p>Dear ${esc(f.salutation||"Sir or Madam")},</p><p style="font-family:Georgia,serif;font-weight:bold">${esc(r.subject)}</p>${r.html}`;}catch(e){}}
async function saveLetter(silent){try{await api("PUT","/api/p/letters/"+LT.id,{action:"update",...letterBody()});if(!silent){toast("Saved");route();}}catch(e){fail(e);throw e;}}
function emailLetter(){const em=(LT.fields||{}).email||"";const m=modal(`<h2>Email this letter</h2><label class="l">Send to</label><input id="elT" type="email" value="${esc(em)}"><p class="hint">The letter is sent in the email and attached as a Word file.</p><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sec fit" onclick="closeModal()">Cancel</button><button class="btn fit" id="elGo">Send</button></div>`);
  m.querySelector("#elGo").onclick=async()=>{try{await saveLetter(true);const r=await api("PUT","/api/p/letters/"+LT.id,{action:"email",to:$("#elT").value});closeModal();toast(r.sent?"Sent":"Queued – it will be retried");route();}catch(e){fail(e);}};}
function postedLetter(){confirmBox("Mark this letter as printed and posted?",async()=>{try{await saveLetter(true);await api("PUT","/api/p/letters/"+LT.id,{action:"posted"});route();}catch(e){fail(e);}},"Mark posted");}
function delLetter(){confirmBox("Delete this draft letter?",async()=>{try{await api("DELETE","/api/p/letters/"+LT.id);location.hash="letters";}catch(e){fail(e);}},"Delete",true);}

/* ---------- GDPR ---------- */
PAGES.gdpr=async(tab,sub)=>{
  const t=tab||"overview";
  const tabs=`<div class="tabs">${[["overview","Overview"],["requests","Requests (SARs)"],["retention","Retention"],["consents","Consents"],["notice","Privacy notice"],["breaches","Breach log"],["ropa","Record of processing"]].map(([k,l])=>`<a href="#gdpr/${k}" class="${t===k?"on":""}">${l}</a>`).join("")}</div>`;
  const head=`<div class="head"><h1>GDPR tools</h1></div>`+tabs;
  if(t==="overview"){
    const y=sub||new Date().getFullYear();const r=await api("GET","/api/p/gdpr/report?year="+y);
    main().innerHTML=head+`<div class="card"><div class="head" style="margin-bottom:8px"><h2 style="margin:0">Yearly report for trustees – ${r.year}</h2><span class="sp"></span><select class="fit" style="width:110px" onchange="location.hash='gdpr/overview/'+this.value">${[0,1,2].map(i=>new Date().getFullYear()-i).map(v=>`<option ${v==r.year?"selected":""}>${v}</option>`).join("")}</select><button class="btn sm sec fit" onclick="window.print()">Print</button></div>
     <div class="kpi"><div><b>${r.sars}</b><span>requests from people (SARs etc.)</span></div><div><b>${r.sarsClosed?Math.round(r.sarsOnTime/r.sarsClosed*100)+"%":"—"}</b><span>answered on time</span></div><div><b>${r.sarAvgDays??"—"}</b><span>average days to answer</span></div><div><b>${r.retentionDeletions}</b><span>retention deletions</span></div><div><b>${r.erasureRequests}</b><span>erasures</span></div><div><b>${r.breaches}</b><span>breaches logged (${r.breachesReported} reported to ICO)</span></div><div><b>${r.consents}</b><span>consents recorded (${r.consentsWithdrawn} withdrawn)</span></div><div><b>${r.holds}</b><span>records on legal hold</span></div></div>
     <p class="hint">Privacy notice: version ${r.noticeVersion}.</p></div>`;
    return;
  }
  if(t==="retention"){
    const [r,h]=await Promise.all([api("GET","/api/p/gdpr/retention"),api("GET","/api/p/gdpr/holds")]);const can=["admin","dplead"].includes(ME.user.role);
    main().innerHTML=head+`<div class="card"><h2>Retention schedule</h2><p class="hint">A nightly job deletes records when their time is up${r.lastRun?` (last run ${fmtDT(r.lastRun)})`:""}. Trustees should confirm these periods.</p><table class="t"><tr><th>Record</th><th>Keep for (days)</th><th>Then</th></tr>${r.rules.map(x=>`<tr><td>${esc(x.record)}</td><td>${can?`<input type="number" min="1" data-rk="${x.key}" value="${x.days}" style="width:110px">`:x.days}<span class="hint"> ≈ ${(x.days/365).toFixed(x.days<365?2:1)} yr</span></td><td>${esc(x.end)}</td></tr>`).join("")}</table>${can?`<button class="btn sm" onclick="saveRet()">Save</button>`:""}</div>

    return;

function newSar(){const m=modal(`<h2>Log a request from a person</h2><div class="row"><div><label class="l">Type of request</label><select id="sT"><option value="access">Copy of their information (SAR)</option><option value="erasure">Delete their information</option><option value="rectification">Correct their information</option><option value="restriction">Stop using their information</option></select></div><div><label class="l">Received on</label><input type="date" id="sR" value="${new Date().toISOString().slice(0,10)}"></div></div>

let SAR=null;
async function gdprSar(id,head){
  const l=await api("GET","/api/p/gdpr/sars");SAR=l.find(s=>s.id===id);if(!SAR)throw new Error("Request not found");
  const s=SAR,closed=s.status==="closed",letters=await api("GET",`/api/p/letters?refType=sar&refId=${id}`);
  main().innerHTML=head+`<div class="head"><div><a href="#gdpr/requests" class="hint">← Requests</a><h1>${esc(s.ref)} – ${esc(s.person.name)}</h1><span class="hint">${esc(s.type)} · received ${fmtD(s.received)} by ${esc(s.channel)} · ${pill(s.status)}</span></div><span class="sp"></span>${!closed?`<button class="btn sec fit" onclick="sarAct('close')">Close request</button>`:""}</div>
  <div class="grid g2"><div class="card"><h2>Deadline</h2>${s.paused?`<div class="warn"><b>Paused</b> – the clock starts when you confirm their identity.</div>${!closed?`<div class="row"><input type="date" id="idD" value="${new Date().toISOString().slice(0,10)}"><input id="idH" placeholder="How, e.g. copy of council tax bill"><button class="btn fit" onclick="sarAct('confirm_id',{date:$('#idD').value,how:$('#idH').value})">Identity confirmed</button></div>`:""}`
   :`<p class="countdown">${closed?"Closed "+fmtD(s.closedAt):s.daysLeft<0?`<span style="color:var(--red)">${-s.daysLeft} days late</span>`:`${s.daysLeft} days left`}</p><p class="hint">Due ${fmtD(s.due)}${s.extension?` (extended: ${esc(s.extension.reason)})`:""}. Warnings are shown at 7 and 2 days.</p>${!closed&&!s.extension?`<button class="btn sm sec" onclick="sarExtend()">Extend by 2 months (complex request)</button>`:""}`}
   <p style="margin-top:10px"><b>Contact:</b> ${esc(s.person.email||"")} ${esc(s.person.phone||"")}<br>${nl(s.person.address||"")}</p>${s.person.details?`<p class="hint">${nl(s.person.details)}</p>`:""}
   <label class="l">Notes</label><textarea id="sNotes" onchange="sarAct('notes',{notes:this.value},true)">${esc(s.notes)}</textarea></div>
  <div class="card"><h2>Letters</h2>${letters.length?`<div class="list">${letters.map(x=>`<div><a href="#letter/${x.id}">${esc(x.templateName)}</a> ${pill(x.status)} <span class="hint">${fmtD(x.at)}</span></div>`).join("")}</div>`:`<p class="empty">None.</p>`}</div></div>
  <div class="card"><div class="head" style="margin-bottom:8px"><h2 style="margin:0">1. Find their data</h2><span class="sp"></span>${!s.paused&&!closed?`<input class="fit" style="width:240px" id="sExtra" placeholder="Other names or references, comma-separated"><button class="btn fit" onclick="sarAct('search',{extra:$('#sExtra').value.split(',').map(x=>x.trim()).filter(Boolean)})">🔎 Find my data</button>`:""}</div>
   ${s.hits.length?`<table class="t"><tr><th></th><th>Record</th><th>Summary</th></tr>${s.hits.map(h=>`<tr><td><input type="checkbox" class="hitC" value="${esc(h.key)}" ${h.include?"checked":""}></td><td>${esc(h.label)}</td><td class="hint">${esc(h.summary)}</td></tr>`).join("")}</table>`:`<p class="empty">${s.paused?"Confirm their identity first.":"Not searched yet. It looks in referrals, website enquiries, letters, accounts, partner contacts, meeting transcripts and minutes, the audit log and consents."}</p>`}</div>
  ${s.hits.length&&!closed?(s.type==="erasure"?`<div class="card"><h2>2. Delete their data</h2><p>Ticked records will be deleted. Grant records that must be kept for accounting have the name and contact details removed instead. Anything kept is listed with the reason, and an erasure letter is drafted.</p>${s.erasure?`<div class="ok">Done ${fmtD(s.erasure.at)}: ${s.erasure.done.length} erased.</div>${s.erasure.kept.length?`<ul>${s.erasure.kept.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`:""}`:""}<button class="btn red" onclick="sarErase()">Erase ticked records</button></div>`
   :`<div class="card"><h2>2. Check and export</h2><p class="hint">Remove anything about other people (for example a family member named in a message). List names or phrases to redact, one per line:</p><textarea id="sRed" placeholder="e.g. Mrs Jones"></textarea>${s.exportedAt?`<div class="ok">Exported ${fmtDT(s.exportedAt)}. <a href="/api/p/sars/${s.id}/export.zip">Download again</a></div>`:""}<button class="btn" onclick="sarExport()">Create protected export</button> <span class="hint">A password-protected ZIP with a readable report, the data, their documents and a cover letter.</span></div>`):""}`;
}
async function sarAct(action,extra,silent){try{if(action==="search"||action==="close"){const keys=[...document.querySelectorAll(".hitC")].filter(c=>c.checked).map(c=>c.value);if(keys.length)await api("PUT","/api/p/gdpr/sars/"+SAR.id,{action:"select",keys});}await api("PUT","/api/p/gdpr/sars/"+SAR.id,{action,...(extra||{})});if(!silent){toast("Saved");route();}}catch(e){fail(e);}}
function sarExtend(){const m=modal(`<h2>Extend the deadline</h2><p>You can extend by up to two more months if the request is complex or there are several requests. You must tell the person within the first month.</p><label class="l">Reason (goes in the letter)</label><input id="exR" placeholder="e.g. the records go back several years and include paper files"><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn sec fit" onclick="closeModal()">Cancel</button><button class="btn fit" id="exGo">Extend</button></div>`);m.querySelector("#exGo").onclick=async()=>{closeModal();await sarAct("extend",{reason:$("#exR")?$("#exR").value:""});};
  m.querySelector("#exGo").onclick=async()=>{const r=$("#exR").value;closeModal();await sarAct("extend",{reason:r});};}
async function sarExport(){try{const keys=[...document.querySelectorAll(".hitC")].filter(c=>c.checked).map(c=>c.value);await api("PUT","/api/p/gdpr/sars/"+SAR.id,{action:"select",keys});const r=await api("POST",`/api/p/gdpr/sars/${SAR.id}/export`,{redact:$("#sRed").value});
  modal(`<h2>Export ready</h2>${r.protected?`<p>The ZIP is protected with this password. <b>Write it down now</b> – it isn't stored. Give it to the person separately (for example by phone), not in the same email.</p><p class="countdown" style="text-align:center;letter-spacing:.08em">${esc(r.password)}</p>`:`<div class="bad">This server can't password-protect ZIP files. Send it only by a secure method, or post it on a USB stick.</div>`}<p><a class="btn" href="${r.download}">⬇ Download the ZIP</a></p><p class="hint">A cover letter has been added to the request's letters.</p><div style="text-align:right"><button class="btn sec" onclick="closeModal();route()">Done</button></div>`);}catch(e){fail(e);}}
function sarErase(){const keys=[...document.querySelectorAll(".hitC")].filter(c=>c.checked).map(c=>c.value);if(!keys.length){toast("Tick the records to erase",true);return;}
  confirmBox(`Erase ${keys.length} record(s)? This can't be undone.`,async()=>{try{const r=await api("POST","/api/p/gdpr/erase",{sarId:SAR.id,keys});toast(`${r.done.length} erased`);route();}catch(e){fail(e);}},"Erase",true);}
function breachCard(b){const left=b.hoursLeft;return`<div class="card"><div class="head" style="margin-bottom:6px"><div><h2 style="margin:0">${esc(b.ref)} ${pill(b.risk==="high"?"error":b.risk==="medium"?"pending":"n",b.risk+" risk")}</h2><span class="hint">Aware ${fmtDT(b.aware)} · ${b.people} people · logged by ${esc(b.byName)}</span></div><span class="sp"></span>${b.status==="closed"?pill("closed"):b.icoAt?pill("done","reported to ICO"):b.ico==="no_report"?pill("n","not reportable"):`<span class="countdown" style="color:${left<24?"var(--red)":"var(--navy)"}">${left>0?Math.floor(left)+"h left to report":"ICO deadline passed"}</span>`}</div>
  <p>${nl(b.summary)}</p>${b.data?`<p class="hint"><b>Data involved:</b> ${esc(b.data)}</p>`:""}
  ${b.status!=="closed"?`<details><summary><b>Work through the checklist</b></summary>
   <div class="chk"><input type="checkbox" ${b.checklist.contained?"checked":""} onchange="updBreach('${b.id}',{checklist:{contained:this.checked}})"><label>1. Contained – stopped it getting worse (e.g. recalled the email, changed passwords)</label></div><textarea placeholder="What you did to contain it" onchange="updBreach('${b.id}',{containment:this.value})">${esc(b.containment)}</textarea>
   <div class="chk"><input type="checkbox" ${b.checklist.assessed?"checked":""} onchange="updBreach('${b.id}',{checklist:{assessed:this.checked}})"><label>2. Assessed the risk to the people affected</label></div><textarea placeholder="Assessment" onchange="updBreach('${b.id}',{assessment:this.value})">${esc(b.assessment)}</textarea>
   <div class="row"><select onchange="updBreach('${b.id}',{risk:this.value})">${["low","medium","high"].map(r=>`<option ${b.risk===r?"selected":""}>${r}</option>`).join("")}</select><input type="number" value="${b.people}" onchange="updBreach('${b.id}',{people:+this.value})" title="people affected"></div>
   <div class="chk"><input type="checkbox" ${b.checklist.decided?"checked":""} onchange="updBreach('${b.id}',{checklist:{decided:this.checked}})"><label>3. Decided whether to report to the ICO (within 72 hours unless it's unlikely to put anyone at risk)</label></div>
   <div class="row"><select onchange="updBreach('${b.id}',{ico:this.value})"><option value="">— decide —</option><option value="report" ${b.ico==="report"?"selected":""}>Report to the ICO</option><option value="no_report" ${b.ico==="no_report"?"selected":""}>Not reportable</option></select><input placeholder="ICO reference" value="${esc(b.icoRef)}" onchange="updBreach('${b.id}',{icoRef:this.value})">${b.ico==="report"&&!b.icoAt?`<button class="btn sm fit" onclick="updBreach('${b.id}',{icoReported:true},1)">Mark reported</button>`:""}</div>

   <div class="chk"><input type="checkbox" ${b.checklist.told?"checked":""} onchange="updBreach('${b.id}',{checklist:{told:this.checked}})"><label>4. Told the people affected (needed if it's high risk to them)</label></div><textarea placeholder="Who was told and how" onchange="updBreach('${b.id}',{told:this.value})">${esc(b.told)}</textarea>
   <div class="row" style="margin-top:8px"><button class="btn sm sec fit" onclick="newLetterBreach('${b.id}')">Draft a letter to people affected</button><button class="btn sm navy fit" onclick="updBreach('${b.id}',{status:'closed'},1)">Close</button></div></details>`:(b.icoReason?`<p class="hint">ICO decision: ${esc(b.ico.replace("_"," "))} – ${esc(b.icoReason)}</p>`:"")}</div>`;}
